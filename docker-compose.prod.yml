services:
  app:
    image: ${IMAGE_REF:-${IMAGE_REPO:-ghcr.io/OWNER/struct-my-data}:${IMAGE_TAG:-latest}}
    env_file:
      - ./etc/.env
    environment:
      PORT: 8080
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/structmydata
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.6:35b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-gemma4:31b}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      JWT_SECRET: ${JWT_SECRET:-}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    stop_grace_period: 30s
    mem_limit: 4g
    cpus: 2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - storage:/app/storage

  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: structmydata
    volumes:
      - pgdata:/var/lib/postgresql/data
    stop_grace_period: 30s
    mem_limit: 4g
    cpus: 2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2@sha256:14a9c00d4e833ebc2b65d36515b37bde3b73f0b323a2663aaafc88953d8c4e3f
    ports:
      - "80:80"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
