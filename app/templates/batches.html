<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batches — Struct My Data</title>
  <style>
    body { max-width: 860px; margin: 2rem auto; padding: 0 1rem; font-family: system-ui, -apple-system, sans-serif; line-height: 1.5; color: #1a1a1a; }
    h1 { font-size: 1.5rem; }
    .nav { margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .nav a { color: #2563eb; text-decoration: none; font-size: 0.9rem; }
    .nav a:hover { text-decoration: underline; }
    .theme-btn { background: none; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; padding: 0.25rem 0.5rem; font-size: 1rem; line-height: 1; }
    table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
    th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; }
    th { background: #f5f5f5; font-weight: 600; }
    .badge { font-size: 0.75rem; padding: 0.15rem 0.4rem; border-radius: 4px; }
    .badge.completed { background: #d1fae5; color: #065f46; }
    .badge.failed { background: #fee2e2; color: #991b1b; }
    .badge.running { background: #dbeafe; color: #1e40af; }
    .badge.pending { background: #e5e7eb; color: #374151; }
    .view-link { color: #2563eb; text-decoration: none; }
    .pagination { margin-top: 0.75rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    .pagination button { padding: 0.3rem 0.6rem; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; }
    .pagination button:disabled { opacity: 0.4; cursor: default; }
    [data-theme="dark"] body { background: #1a1a1a; color: #e5e5e5; }
    [data-theme="dark"] .nav a { color: #60a5fa; }
    [data-theme="dark"] .theme-btn { border-color: #555; }
    [data-theme="dark"] th, [data-theme="dark"] td { border-color: #404040; }
    [data-theme="dark"] th { background: #2d2d2d; }
    [data-theme="dark"] .badge.pending { background: #404040; color: #9ca3af; }
    [data-theme="dark"] .badge.completed { background: #064e3b; color: #6ee7b7; }
    [data-theme="dark"] .badge.failed { background: #7f1d1d; color: #fca5a5; }
    [data-theme="dark"] .badge.running { background: #1e3a5f; color: #93c5fd; }
    [data-theme="dark"] .view-link { color: #60a5fa; }
    [data-theme="dark"] .pagination button { background: #2d2d2d; border-color: #555; color: #e5e5e5; }
  </style>
</head>
<body>
  <div class="nav">
    <div style="display:flex;gap:1rem;align-items:center">
      <a href="/">&larr; Extraction</a>
      <a href="/ui/batches" style="font-weight:600">Batches</a>
      <a href="/usage">Usage</a>
    </div>
    <div style="display:flex;gap:0.5rem;align-items:center">
      <button id="theme-btn" class="theme-btn" title="Toggle theme">&#x1F319;</button>
      <a href="#" onclick="fetch('/auth/logout',{method:'POST'}).then(function(){window.location.href='/login'});return false" style="font-size:0.85rem;text-decoration:none">Logout</a>
    </div>
  </div>
  <h1>Batches</h1>
  <div id="batches-table"><p>Loading...</p></div>
  <script>
    var offset = 0;
    var pageSize = 20;

    function loadBatches() {
      fetch('/api/batches?offset=' + offset + '&limit=' + pageSize).then(function(r) { return r.json(); }).then(function(data) {
        var el = document.getElementById('batches-table');
        if (!data.batches || data.batches.length === 0) {
          el.innerHTML = '<p style="color:#9ca3af">No batches yet. Select multiple files on the extraction page to create one.</p>';
          return;
        }
        var html = '<table><thead><tr><th>Name</th><th>Created</th><th>Progress</th><th>Status</th><th></th></tr></thead><tbody>';
        data.batches.forEach(function(b) {
          var done = b.completed + b.failed;
          var status = b.running > 0 || b.pending > 0 ? 'running' : (b.failed > 0 ? 'failed' : 'completed');
          var badge = '<span class="badge ' + status + '">' + status + '</span>';
          html += '<tr><td>' + b.name + '</td><td>' + (b.created_at || '').slice(0, 16).replace('T', ' ') + '</td>'
            + '<td>' + done + '/' + b.total + ' (' + b.completed + ' ok, ' + b.failed + ' failed)</td>'
            + '<td>' + badge + '</td>'
            + '<td><a class="view-link" href="/ui/batches/' + b.id + '">Open</a></td></tr>';
        });
        html += '</tbody></table>';

        var totalPages = Math.max(1, Math.ceil(data.total / pageSize));
        var page = Math.floor(offset / pageSize) + 1;
        html += '<div class="pagination">'
          + '<button ' + (offset === 0 ? 'disabled' : '') + ' onclick="offset=Math.max(0,offset-' + pageSize + ');loadBatches()">&larr; Prev</button>'
          + '<span>Page ' + page + ' of ' + totalPages + ' (' + data.total + ' batches)</span>'
          + '<button ' + (offset + pageSize >= data.total ? 'disabled' : '') + ' onclick="offset=offset+' + pageSize + ';loadBatches()">Next &rarr;</button>'
          + '</div>';
        el.innerHTML = html;
      });
    }

    loadBatches();
  </script>
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'light';
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      var btn = document.getElementById('theme-btn');
      if (btn) {
        btn.textContent = theme === 'dark' ? '\u2600\uFE0F' : '\uD83C\uDF19';
        btn.addEventListener('click', function() {
          var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          btn.textContent = next === 'dark' ? '\u2600\uFE0F' : '\uD83C\uDF19';
        });
      }
    })();
  </script>
</body>
</html>
