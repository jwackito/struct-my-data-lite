<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extraction Result — Struct My Data</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.0/styles/github.min.css">
  <style>
    body {
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      color: #1a1a1a;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
    .nav { margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .nav a { color: #2563eb; text-decoration: none; font-size: 0.9rem; }
    .nav a:hover { text-decoration: underline; }
    .theme-btn { background: none; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; padding: 0.25rem 0.5rem; font-size: 1rem; line-height: 1; }
    .stats {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 0.5rem;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 1rem;
      font-size: 0.875rem;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 0.5rem;
      text-align: left;
      vertical-align: top;
    }
    th { background: #f5f5f5; font-weight: 600; }
    td pre { margin: 0; font-size: 0.8rem; }
    .error {
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 0.75rem;
      border-radius: 4px;
    }
    .error pre { margin: 0.5rem 0 0; white-space: pre-wrap; }
    .output pre {
      background: #f5f5f5;
      padding: 0.75rem;
      border-radius: 4px;
      overflow-x: auto;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 0.8rem;
      line-height: 1.4;
    }
    .actions { margin-top: 1rem; }
    .btn {
      display: inline-block;
      padding: 0.6rem 1.2rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { background: #1d4ed8; }
    pre { font-size: 0.8rem; }
    [data-theme="dark"] body { background: #1a1a1a; color: #e5e5e5; }
    [data-theme="dark"] .nav a { color: #60a5fa; }
    [data-theme="dark"] .theme-btn { border-color: #555; }
    [data-theme="dark"] .stats { color: #9ca3af; }
    [data-theme="dark"] th, [data-theme="dark"] td { border-color: #404040; }
    [data-theme="dark"] th { background: #2d2d2d; }
    [data-theme="dark"] .error { color: #fca5a5; background: #3b1a1a; border-color: #7f1d1d; }
    [data-theme="dark"] .output pre { background: #2d2d2d; }
    [data-theme="dark"] .btn:hover { background: #3b82f6; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="/">&larr; Back to extraction</a>
    <div style="display:flex;gap:0.5rem;align-items:center">
      <button id="theme-btn" class="theme-btn" title="Toggle theme">&#x1F319;</button>
      <a href="#" onclick="fetch('/auth/logout',{method:'POST'}).then(function(){window.location.href='/login'});return false" style="font-size:0.85rem;text-decoration:none">Logout</a>
    </div>
  </div>
  <h1>Extraction Result</h1>
  {% if status == "completed" %}
    <div class="stats">{{ stats_html | safe }}</div>
    <div class="actions">
      <a href="/ui/jobs/{{ job_id }}/download" class="btn">Download JSON</a>
    </div>
    <div class="output">{{ output_html | safe }}</div>
  {% elif status == "failed" %}
    <div class="error">
      <p>Extraction failed:</p>
      <pre>{{ error_message }}</pre>
    </div>
    <div class="actions">
      <a href="/" class="btn">Return to extraction</a>
    </div>
  {% else %}
    <p>&#x23F3; {{ status | capitalize }}...</p>
    <script>setTimeout(function() { location.reload(); }, 2000);</script>
  {% endif %}
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.0/highlight.min.js"></script>
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'light';
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      var btn = document.getElementById('theme-btn');
      if (btn) {
        btn.textContent = theme === 'dark' ? '\u2600\uFE0F' : '\uD83C\uDF19';
        btn.addEventListener('click', function() {
          var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          btn.textContent = next === 'dark' ? '\u2600\uFE0F' : '\uD83C\uDF19';
          var hl = document.querySelector('link[href*="highlight"][href*="github"]');
          if (hl) {
            hl.href = next === 'dark'
              ? 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.0/styles/github-dark.min.css'
              : 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.0/styles/github.min.css';
          }
        });
      }
      if (theme === 'dark') {
        var hl = document.querySelector('link[href*="highlight"][href*="github"]');
        if (hl && hl.href.indexOf('dark') === -1)
          hl.href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.0/styles/github-dark.min.css';
      }
      var el = document.querySelector('.output pre');
      if (el) hljs.highlightElement(el);
    })();
  </script>
</body>
</html>
