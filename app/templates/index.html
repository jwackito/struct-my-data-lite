<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Struct My Data</title>
  <script src="https://unpkg.com/htmx.org@2"></script>
  <style>
    body {
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      color: #1a1a1a;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-weight: 600;
      font-size: 0.875rem;
    }
    input[type="file"], textarea {
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.875rem;
    }
    textarea {
      font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
      font-size: 0.8rem;
      box-sizing: border-box;
      width: 100%;
    }
    button {
      padding: 0.6rem 1.2rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
      align-self: flex-start;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: default; }
    .htmx-request button { opacity: 0.7; pointer-events: none; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline; }
    .htmx-request .button-label { display: none; }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 1rem;
      font-size: 0.875rem;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 0.5rem;
      text-align: left;
      vertical-align: top;
    }
    th { background: #f5f5f5; font-weight: 600; }
    td pre { margin: 0; font-size: 0.8rem; }
    #result { margin-top: 1rem; }
    .error {
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 0.75rem;
      border-radius: 4px;
    }

    .tab-bar {
      display: flex;
      gap: 0;
      border-bottom: 2px solid #e5e7eb;
      margin-bottom: 0.75rem;
    }
    .tab {
      padding: 0.5rem 1rem;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      color: #6b7280;
      font-size: 0.875rem;
      cursor: pointer;
      margin-bottom: -2px;
    }
    .tab.active {
      background: #fff;
      color: #1a1a1a;
      border-bottom: 2px solid #2563eb;
      font-weight: 600;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .model-name-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .model-name-row label {
      flex-shrink: 0;
      font-size: 0.875rem;
    }
    .model-name-row input {
      flex: 1;
      max-width: 300px;
      padding: 0.4rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.875rem;
      font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
    }

    .field-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .field-row {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .field-row input, .field-row select {
      padding: 0.4rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .field-row .field-name {
      flex: 0 0 150px;
      font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
    }
    .field-row .field-type {
      flex: 0 0 140px;
    }
    .field-row .field-desc {
      flex: 1 1 180px;
    }
    .field-row .remove-field {
      padding: 0.2rem 0.5rem;
      background: transparent;
      color: #9ca3af;
      font-size: 1.1rem;
      line-height: 1;
      align-self: center;
    }
    .field-row .remove-field:hover {
      color: #b91c1c;
      background: transparent;
    }
    .field-row .toggle-nested {
      padding: 0.15rem 0.35rem;
      background: transparent;
      color: #6b7280;
      font-size: 0.65rem;
      cursor: pointer;
      border: 1px solid #d1d5db;
      border-radius: 3px;
      align-self: center;
      line-height: 1;
    }
    .field-row .toggle-nested:hover {
      background: #f3f4f6;
    }

    .field-row-nested {
      margin-left: 0.5rem;
    }
    .field-row-nested input, .field-row-nested select {
      font-size: 0.75rem;
    }
    .field-row-nested .field-name { flex: 0 0 130px; }
    .field-row-nested .field-type { flex: 0 0 120px; }
    .field-row-nested .field-desc { flex: 1 1 140px; }

    .nested-fields {
      flex: 0 0 100%;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin: 0.4rem 0 0.2rem 1.2rem;
      padding: 0.5rem 0.5rem 0.5rem 0.75rem;
      border-left: 2px solid #e5e7eb;
      background: #fafafa;
      border-radius: 0 4px 4px 0;
    }
    .nested-add-field {
      padding: 0.25rem 0.6rem;
      background: transparent;
      color: #6b7280;
      font-size: 0.75rem;
      border: 1px dashed #d1d5db;
      border-radius: 3px;
      cursor: pointer;
      align-self: flex-start;
    }
    .nested-add-field:hover {
      background: #f3f4f6;
      color: #1a1a1a;
    }

    .builder-actions {
      display: flex;
      gap: 0.5rem;
    }
    .btn-secondary {
      background: #6b7280;
    }
    .btn-secondary:hover { background: #4b5563; }

    .empty-state {
      color: #9ca3af;
      font-size: 0.875rem;
      font-style: italic;
      padding: 0.5rem 0;
    }
  </style>
</head>
<body>
  <h1>Struct My Data</h1>
  <form hx-post="/ui/extract" hx-target="#result" enctype="multipart/form-data">
    <div>
      <label>Document <input type="file" name="file" required></label>
    </div>
    <div class="schema-section">
      <label>Pydantic Schema</label>
      <div class="tab-bar">
        <button type="button" class="tab active" data-tab="builder">Builder</button>
        <button type="button" class="tab" data-tab="code">Code</button>
      </div>
      <div class="tab-panel active" id="tab-builder">
        <div class="builder">
          <div class="model-name-row">
            <label for="model-name">Model Name</label>
            <input type="text" id="model-name" value="ExtractedData">
          </div>
          <div class="field-list" id="field-list"></div>
          <div class="builder-actions">
            <button type="button" id="add-field">+ Add Field</button>
            <button type="button" id="generate-code" class="btn-secondary">Generate Code</button>
          </div>
        </div>
      </div>
      <div class="tab-panel" id="tab-code">
        <textarea name="pydantic_schema" rows="10">from pydantic import BaseModel, Field
from typing import List

class OfficialsList(BaseModel):
    names: List[str] = Field(description="Full names of all people")
    positions: List[str] = Field(description="Positions in same order")</textarea>
      </div>
    </div>
    <button type="submit">
      <span class="button-label">Extract</span>
      <span class="htmx-indicator">⏳ Extracting...</span>
    </button>
  </form>
  <div id="result"></div>

  <script>
    (function () {
      var TYPE_MAP = {
        str: "str",
        int: "int",
        float: "float",
        bool: "bool",
        date: "str",
        "List[str]": "List[str]",
        "List[float]": "List[float]",
        "List[int]": "List[int]",
      };

      var SIMPLE_TYPES = [
        ["str", "string"],
        ["int", "integer"],
        ["float", "number"],
        ["bool", "boolean"],
        ["date", "date"],
        ["List[str]", "list of string"],
        ["List[float]", "list of number"],
        ["List[int]", "list of integer"],
      ];

      var OBJECT_TYPES = [
        ["Object", "Object"],
        ["List[Object]", "List of Object"],
      ];

      var fieldList = document.getElementById("field-list");
      var modelNameInput = document.getElementById("model-name");
      var textarea = document.querySelector("textarea[name='pydantic_schema']");

      function createTypeOptions(selected, level) {
        var types = SIMPLE_TYPES.slice();
        if (level < 2) types = types.concat(OBJECT_TYPES);
        return types.map(function (t) {
          var opt = document.createElement("option");
          opt.value = t[0];
          opt.textContent = t[1];
          if (t[0] === (selected || "str")) opt.selected = true;
          return opt;
        });
      }

      function createFieldRow(name, type, desc, level) {
        level = level || 0;
        var row = document.createElement("div");
        row.className = "field-row" + (level > 0 ? " field-row-nested" : "");
        row.dataset.level = level;

        var nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.className = "field-name";
        nameInput.placeholder = "field_name";
        nameInput.value = name || "";

        var typeSelect = document.createElement("select");
        typeSelect.className = "field-type";
        createTypeOptions(type, level).forEach(function (opt) { typeSelect.appendChild(opt); });

        var descInput = document.createElement("input");
        descInput.type = "text";
        descInput.className = "field-desc";
        descInput.placeholder = "Description";
        descInput.value = desc || "";

        var toggleBtn = document.createElement("button");
        toggleBtn.type = "button";
        toggleBtn.className = "toggle-nested";
        toggleBtn.textContent = "\u25bc";
        toggleBtn.style.display = "none";

        var removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "remove-field";
        removeBtn.textContent = "\u00d7";

        var container = row;
        container.appendChild(nameInput);
        container.appendChild(typeSelect);
        container.appendChild(descInput);
        container.appendChild(toggleBtn);
        container.appendChild(removeBtn);

        var nestedContainer = document.createElement("div");
        nestedContainer.className = "nested-fields";
        nestedContainer.style.display = "none";

        var nestedAddBtn = document.createElement("button");
        nestedAddBtn.type = "button";
        nestedAddBtn.className = "nested-add-field";
        nestedAddBtn.textContent = "+ Add sub-field";
        nestedAddBtn.addEventListener("click", function () {
          addField("", "str", "", level + 1, nestedContainer);
          nestedContainer.style.display = "block";
          toggleBtn.textContent = "\u25bc";
        });
        nestedContainer.appendChild(nestedAddBtn);
        container.appendChild(nestedContainer);

        typeSelect.addEventListener("change", function () {
          var val = this.value;
          var isNested = val === "Object" || val === "List[Object]";
          if (isNested) {
            nestedContainer.style.display = "block";
            toggleBtn.style.display = "";
            var rows = nestedContainer.querySelectorAll(":scope > .field-row");
            if (rows.length === 0) {
              addField("", "str", "", level + 1, nestedContainer);
            }
          } else {
            nestedContainer.style.display = "none";
            toggleBtn.style.display = "none";
          }
        });

        toggleBtn.addEventListener("click", function () {
          var hidden = nestedContainer.style.display === "none";
          nestedContainer.style.display = hidden ? "block" : "none";
          this.textContent = hidden ? "\u25bc" : "\u25b6";
        });

        removeBtn.addEventListener("click", function () {
          var parent = container.parentElement;
          container.remove();
          toggleEmptyState(parent);
        });

        return row;
      }

      function addField(name, type, desc, level, container) {
        container = container || fieldList;
        level = level || 0;
        var row = createFieldRow(name, type || "str", desc || "", level);
        var addBtn = container.querySelector(".nested-add-field");
        if (addBtn) {
          container.insertBefore(row, addBtn);
        } else {
          container.appendChild(row);
        }
        toggleEmptyState(container);
      }

      function toggleEmptyState(container) {
        var rows = container.querySelectorAll(":scope > .field-row");
        var existing = container.querySelector(".empty-state");
        if (rows.length === 0) {
          if (!existing) {
            var el = document.createElement("div");
            el.className = "empty-state";
            el.textContent = 'No fields yet. Click "+ Add Field" to start.';
            var addBtn = container.querySelector(".nested-add-field");
            if (addBtn) {
              container.insertBefore(el, addBtn);
            } else {
              container.appendChild(el);
            }
          }
        } else {
          if (existing) existing.remove();
        }
      }

      function collectFields(container) {
        var fields = [];
        var rows = container.querySelectorAll(":scope > .field-row");
        rows.forEach(function (row) {
          var name = row.querySelector(".field-name").value.trim();
          if (!name) return;
          var type = row.querySelector(".field-type").value;
          var desc = row.querySelector(".field-desc").value.trim();
          var f = { name: name, type: type, desc: desc, children: [] };
          if (type === "Object" || type === "List[Object]") {
            var nc = row.querySelector(".nested-fields");
            if (nc) f.children = collectFields(nc);
          }
          fields.push(f);
        });
        return fields;
      }

      function fieldsHaveList(fields) {
        for (var i = 0; i < fields.length; i++) {
          var f = fields[i];
          if (f.type.indexOf("List") === 0) return true;
          if (f.children.length > 0 && fieldsHaveList(f.children)) return true;
        }
        return false;
      }

      var nestedCounter = 0;
      var nestedDefs = [];

      function buildModel(modelName, fields) {
        var lines = [];
        lines.push("class " + modelName + "(BaseModel):");
        if (fields.length === 0) {
          lines.push("    pass");
        } else {
          fields.forEach(function (f) {
            var isNested = f.type === "Object" || f.type === "List[Object]";
            if (isNested) {
              nestedCounter++;
              var nestedName = "NestedModel" + nestedCounter;
              var prefix = f.type === "List[Object]" ? "List[" : "";
              var suffix = f.type === "List[Object]" ? "]" : "";
              lines.push("    " + f.name + ": " + prefix + nestedName + suffix + formatDesc(f.desc));
              buildModel(nestedName, f.children);
            } else {
              var pyType = TYPE_MAP[f.type] || "str";
              lines.push("    " + f.name + ": " + pyType + formatDesc(f.desc));
            }
          });
        }
        nestedDefs.push(lines.join("\n"));
      }

      function formatDesc(desc) {
        if (!desc) return "";
        return ' = Field(description="' + desc.replace(/"/g, '\\"') + '")';
      }

      function generateCode() {
        var fields = collectFields(document.getElementById("field-list"));
        var modelName = modelNameInput.value.trim() || "ExtractedData";
        nestedCounter = 0;
        nestedDefs = [];

        buildModel(modelName, fields);

        var needsList = fieldsHaveList(fields);
        var imports = ["from pydantic import BaseModel, Field"];
        if (needsList) imports.push("from typing import List");

        textarea.value = imports.join("\n") + "\n\n" + nestedDefs.join("\n\n");
        switchTab("code");
      }

      function switchTab(tabId) {
        var tabs = document.querySelectorAll(".tab");
        tabs.forEach(function (t) {
          t.classList.toggle("active", t.dataset.tab === tabId);
        });
        var panels = document.querySelectorAll(".tab-panel");
        panels.forEach(function (p) {
          p.classList.toggle("active", p.id === "tab-" + tabId);
        });
      }

      document.querySelectorAll(".tab").forEach(function (tab) {
        tab.addEventListener("click", function () {
          switchTab(this.dataset.tab);
        });
      });

      document.getElementById("add-field").addEventListener("click", function () {
        addField("", "str", "");
      });

      document.getElementById("generate-code").addEventListener("click", generateCode);

      addField("names", "List[str]", "Full names of all people");
      addField("positions", "List[str]", "Positions in same order");
      modelNameInput.value = "OfficialsList";
    })();
  </script>
</body>
</html>
