<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Struct My Data</title>
  <script src="https://unpkg.com/htmx.org@2"></script>
  <style>
    body {
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      color: #1a1a1a;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-weight: 600;
      font-size: 0.875rem;
    }
    input[type="file"], textarea {
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.875rem;
    }
    textarea {
      font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
      font-size: 0.8rem;
      box-sizing: border-box;
      width: 100%;
    }
    button {
      padding: 0.6rem 1.2rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
      align-self: flex-start;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: default; }
    .htmx-request button { opacity: 0.7; pointer-events: none; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline; }
    .htmx-request .button-label { display: none; }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 1rem;
      font-size: 0.875rem;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 0.5rem;
      text-align: left;
      vertical-align: top;
    }
    th { background: #f5f5f5; font-weight: 600; }
    td pre { margin: 0; font-size: 0.8rem; }
    #result { margin-top: 1rem; }
    .error {
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 0.75rem;
      border-radius: 4px;
    }

    .tab-bar {
      display: flex;
      gap: 0;
      border-bottom: 2px solid #e5e7eb;
      margin-bottom: 0.75rem;
    }
    .tab {
      padding: 0.5rem 1rem;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      color: #6b7280;
      font-size: 0.875rem;
      cursor: pointer;
      margin-bottom: -2px;
    }
    .tab.active {
      background: #fff;
      color: #1a1a1a;
      border-bottom: 2px solid #2563eb;
      font-weight: 600;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    select#model-select {
      padding: 0.4rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.875rem;
      font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
      max-width: 100%;
    }

    .model-name-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .model-name-row label {
      flex-shrink: 0;
      font-size: 0.875rem;
    }
    .model-name-row input {
      flex: 1;
      max-width: 300px;
      padding: 0.4rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.875rem;
      font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
    }

    .field-separator {
      height: 1px;
      background: #e5e7eb;
      margin: 0.5rem 0;
    }

    .field-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .field-row {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .field-row input, .field-row select {
      padding: 0.4rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .field-row .drag-handle {
      flex: 0 0 16px;
      padding: 0.2rem 0;
      cursor: grab;
      color: #9ca3af;
      font-size: 0.85rem;
      text-align: center;
      user-select: none;
      align-self: center;
      line-height: 1;
    }
    .field-row .drag-handle:active { cursor: grabbing; }
    .field-row .field-name {
      flex: 0 0 150px;
      font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
    }
    .field-row .field-name-invalid {
      border-color: #ef4444;
      background: #fef2f2;
    }
    .field-row .field-type {
      flex: 0 0 140px;
    }
    .field-row .field-desc {
      flex: 1 1 180px;
    }
    .field-row .remove-field {
      padding: 0.2rem 0.5rem;
      background: transparent;
      color: #9ca3af;
      font-size: 1.1rem;
      line-height: 1;
      align-self: center;
    }
    .field-row .remove-field:hover {
      color: #b91c1c;
      background: transparent;
    }
    .field-row .toggle-nested {
      padding: 0.15rem 0.35rem;
      background: transparent;
      color: #6b7280;
      font-size: 0.65rem;
      cursor: pointer;
      border: 1px solid #d1d5db;
      border-radius: 3px;
      align-self: center;
      line-height: 1;
    }
    .field-row .toggle-nested:hover {
      background: #f3f4f6;
    }

    .field-row.dragging {
      opacity: 0.4;
    }
    .field-row.drag-over-target {
      border-bottom: 2px solid #2563eb;
    }

    .field-row-nested {
      margin-left: 0.5rem;
    }
    .field-row-nested input, .field-row-nested select {
      font-size: 0.75rem;
    }
    .field-row-nested .field-name { flex: 0 0 130px; }
    .field-row-nested .field-type { flex: 0 0 120px; }
    .field-row-nested .field-desc { flex: 1 1 140px; }

    .nested-fields {
      flex: 0 0 100%;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin: 0.4rem 0 0.2rem 1.2rem;
      padding: 0.5rem 0.5rem 0.5rem 0.75rem;
      border-left: 2px solid #e5e7eb;
      background: #fafafa;
      border-radius: 0 4px 4px 0;
    }
    .nested-add-field {
      padding: 0.25rem 0.6rem;
      background: transparent;
      color: #6b7280;
      font-size: 0.75rem;
      border: 1px dashed #d1d5db;
      border-radius: 3px;
      cursor: pointer;
      align-self: flex-start;
    }
    .nested-add-field:hover {
      background: #f3f4f6;
      color: #1a1a1a;
    }

    .builder-actions {
      display: flex;
      gap: 0.5rem;
    }
    .btn-secondary {
      background: #6b7280;
    }
    .btn-secondary:hover { background: #4b5563; }

    .empty-state {
      color: #9ca3af;
      font-size: 0.875rem;
      font-style: italic;
      padding: 0.5rem 0;
    }

    .validation-error {
      color: #dc2626;
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }

    .schema-templates {
      margin-top: 1rem;
      border-top: 1px solid #e5e7eb;
      padding-top: 0.75rem;
    }
    .templates-row {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .templates-row select {
      flex: 1;
      min-width: 180px;
      padding: 0.4rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .templates-row button, .templates-import-row button {
      font-size: 0.8rem;
      padding: 0.4rem 0.7rem;
    }
    .templates-import-row {
      margin-top: 0.4rem;
    }
    .btn-danger {
      background: #dc2626;
    }
    .btn-danger:hover { background: #b91c1c; }
    .theme-btn { background: none; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; padding: 0.25rem 0.5rem; font-size: 1rem; line-height: 1; }
    [data-theme="dark"] body { background: #1a1a1a; color: #e5e5e5; }
    [data-theme="dark"] a { color: #60a5fa; }
    [data-theme="dark"] .theme-btn { border-color: #555; }
    [data-theme="dark"] input[type="file"], [data-theme="dark"] textarea, [data-theme="dark"] select#model-select, [data-theme="dark"] .field-row input, [data-theme="dark"] .templates-row input { background: #2d2d2d; color: #e5e5e5; border-color: #555; }
    [data-theme="dark"] .tab-bar { border-bottom-color: #404040; }
    [data-theme="dark"] .tab { background: #2d2d2d; border-color: #404040; color: #9ca3af; }
    [data-theme="dark"] .tab.active { background: #1a1a1a; color: #e5e5e5; }
    [data-theme="dark"] th, [data-theme="dark"] td { border-color: #404040; }
    [data-theme="dark"] th { background: #2d2d2d; }
    [data-theme="dark"] .error { color: #fca5a5; background: #3b1a1a; border-color: #7f1d1d; }
    [data-theme="dark"] .btn:hover, [data-theme="dark"] #add-field:hover { background: #3b82f6; }
    [data-theme="dark"] .field-row .remove-field:hover { color: #fca5a5; }
    [data-theme="dark"] .validation-error { color: #fca5a5; background: #3b1a1a; border-color: #7f1d1d; }
    [data-theme="dark"] .schema-templates .templates-row button { background: #2d2d2d; color: #e5e5e5; border-color: #555; }
  </style>
</head>
<body>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem">
    <h1 style="margin:0">Struct My Data</h1>
    <div style="display:flex;gap:0.5rem;align-items:center">
      <a id="admin-link" href="/admin" style="display:none;font-size:0.85rem;text-decoration:none">Admin</a>
      <a id="usage-link" href="/usage" style="font-size:0.85rem;text-decoration:none">Usage</a>
      <button id="theme-btn" class="theme-btn" title="Toggle theme">&#x1F319;</button>
      <a href="/ui/settings" style="font-size:1.3rem;text-decoration:none;color:#6b7280" title="Settings">&#9881;</a>
      <a href="#" onclick="fetch('/auth/logout',{method:'POST'}).then(function(){window.location.href='/login'});return false" style="font-size:0.85rem;text-decoration:none">Logout</a>
    </div>
  </div>
  <form hx-post="/ui/extract" hx-target="#result" enctype="multipart/form-data">
    <div>
      <label>Document <input type="file" name="file" required></label>
    </div>
    <div>
      <label>Model
        <select name="model_id" id="model-select">
          <option value="">Loading models...</option>
        </select>
      </label>
    </div>
    <div class="schema-section">
      <label>Pydantic Schema</label>
      <div class="tab-bar">
        <button type="button" class="tab active" data-tab="builder">Builder</button>
        <button type="button" class="tab" data-tab="code">Code</button>
        <button type="button" class="tab" data-tab="history" hx-get="/ui/jobs" hx-target="#tab-history" hx-trigger="click once">History</button>
      </div>
      <div class="tab-panel active" id="tab-builder">
        <div class="builder">
          <div class="model-name-row">
            <label for="model-name">Model Name</label>
            <input type="text" id="model-name" value="ExtractedData">
          </div>
          <div class="field-separator"></div>
          <div class="field-list" id="field-list"></div>
          <div class="builder-actions">
            <button type="button" id="add-field">+ Add Field</button>
            <button type="button" id="generate-code" class="btn-secondary">Generate Code</button>
            <button type="button" id="import-code" class="btn-secondary">&#8635; Import from Code</button>
          </div>
          <div id="builder-error" class="validation-error" style="display:none"></div>
        </div>
      </div>
      <div class="tab-panel" id="tab-code">
        <textarea name="pydantic_schema" rows="10">from pydantic import BaseModel, Field
from typing import List

class OfficialsList(BaseModel):
    names: List[str] = Field(description="Full names of all people")
    positions: List[str] = Field(description="Positions in same order")</textarea>
      </div>
      <div class="schema-templates">
        <label>Saved Schemas</label>
        <div class="templates-row">
          <select id="template-select">
            <option value="">Select a saved schema...</option>
          </select>
          <button type="button" id="template-load">Load</button>
          <button type="button" id="template-save" class="btn-secondary">Save</button>
          <button type="button" id="template-delete" class="btn-danger">&times;</button>
          <button type="button" id="template-export" class="btn-secondary">Export</button>
        </div>
        <div class="templates-import-row">
          <button type="button" id="template-import" class="btn-secondary">Import .py file...</button>
          <input type="file" id="template-import-input" accept=".py,.json,.txt" style="display:none">
        </div>
      </div>
    </div>
    <button type="submit">
      <span class="button-label">Extract</span>
      <span class="htmx-indicator">⏳ Extracting...</span>
    </button>
  </form>
  <div id="result"></div>
  <div class="tab-panel" id="tab-history"></div>

  <script>
    (function () {
      var TYPE_MAP = {
        str: "str",
        int: "int",
        float: "float",
        bool: "bool",
        date: "str",
        "List[str]": "List[str]",
        "List[float]": "List[float]",
        "List[int]": "List[int]",
      };

      var SIMPLE_TYPES = [
        ["str", "string"],
        ["int", "integer"],
        ["float", "number"],
        ["bool", "boolean"],
        ["date", "date"],
        ["List[str]", "list of string"],
        ["List[float]", "list of number"],
        ["List[int]", "list of integer"],
      ];

      var OBJECT_TYPES = [
        ["Object", "Object"],
        ["List[Object]", "List of Object"],
      ];

      var fieldList = document.getElementById("field-list");
      var modelNameInput = document.getElementById("model-name");
      var textarea = document.querySelector("textarea[name='pydantic_schema']");
      var builderError = document.getElementById("builder-error");

      var FIELD_NAME_RE = /^[a-zA-Z_][a-zA-Z0-9_]*$/;

      var dragState = null;

      function findAddButton(container) {
        var children = container.children;
        for (var i = 0; i < children.length; i++) {
          if (children[i].classList.contains("nested-add-field")) {
            return children[i];
          }
        }
        return null;
      }

      function createTypeOptions(selected, level) {
        var types = SIMPLE_TYPES.slice();
        if (level < 2) types = types.concat(OBJECT_TYPES);
        return types.map(function (t) {
          var opt = document.createElement("option");
          opt.value = t[0];
          opt.textContent = t[1];
          if (t[0] === (selected || "str")) opt.selected = true;
          return opt;
        });
      }

      function toggleGenerateButton() {
        var rows = fieldList.querySelectorAll(":scope > .field-row");
        document.getElementById("generate-code").disabled = rows.length === 0;
      }

      function validateFieldName(input) {
        var val = input.value.trim();
        if (val && !FIELD_NAME_RE.test(val)) {
          input.classList.add("field-name-invalid");
        } else {
          input.classList.remove("field-name-invalid");
        }
      }

      function getDuplicateNames(container) {
        var names = {};
        var dupes = {};
        var rows = container.querySelectorAll(":scope > .field-row");
        rows.forEach(function (row) {
          var name = row.querySelector(".field-name").value.trim();
          if (!name) return;
          if (names[name]) {
            dupes[name] = true;
          } else {
            names[name] = true;
          }
        });
        return dupes;
      }

      function highlightDupes(container) {
        var dupes = getDuplicateNames(container);
        var rows = container.querySelectorAll(":scope > .field-row");
        rows.forEach(function (row) {
          var inp = row.querySelector(".field-name");
          var name = inp.value.trim();
          if (name && dupes[name]) {
            inp.classList.add("field-name-invalid");
          }
        });
      }

      function makeFieldDraggable(row) {
        row.addEventListener("dragstart", function (e) {
          if (!e.target.classList.contains("drag-handle")) {
            e.preventDefault();
            return;
          }
          dragState = { element: row, container: row.parentElement };
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", "");
          row.classList.add("dragging");
        });

        row.addEventListener("dragend", function () {
          row.classList.remove("dragging");
          document.querySelectorAll(".field-row").forEach(function (r) {
            r.classList.remove("drag-over-target");
          });
          dragState = null;
        });

        row.addEventListener("dragover", function (e) {
          if (!dragState || dragState.element === row) return;
          if (row.parentElement !== dragState.container) return;
          e.preventDefault();
          var rect = row.getBoundingClientRect();
          var mid = rect.top + rect.height / 2;
          if (e.clientY < mid) {
            dragState.container.insertBefore(dragState.element, row);
          } else {
            dragState.container.insertBefore(dragState.element, row.nextSibling);
          }
        });

        row.addEventListener("dragenter", function (e) {
          if (!dragState || dragState.element === row) return;
          if (row.parentElement !== dragState.container) return;
          e.preventDefault();
          row.classList.add("drag-over-target");
        });

        row.addEventListener("dragleave", function () {
          row.classList.remove("drag-over-target");
        });

        row.addEventListener("drop", function (e) {
          e.preventDefault();
          row.classList.remove("drag-over-target");
        });

        var handle = row.querySelector(".drag-handle");
        if (handle) {
          handle.addEventListener("touchstart", function (e) {
            var r = this.closest(".field-row");
            dragState = { element: r, container: r.parentElement };
            r.style.opacity = "0.5";
          }, { passive: true });

          handle.addEventListener("touchmove", function (e) {
            if (!dragState) return;
            e.preventDefault();
            var touch = e.touches[0];
            dragState.element.style.display = "none";
            var target = document.elementFromPoint(touch.clientX, touch.clientY);
            dragState.element.style.display = "";
            if (target) {
              var targetRow = target.closest(".field-row");
              if (targetRow && targetRow !== dragState.element && targetRow.parentElement === dragState.container) {
                var rect = targetRow.getBoundingClientRect();
                var mid = rect.top + rect.height / 2;
                if (touch.clientY < mid) {
                  dragState.container.insertBefore(dragState.element, targetRow);
                } else {
                  dragState.container.insertBefore(dragState.element, targetRow.nextSibling);
                }
              }
            }
          }, { passive: false });

          handle.addEventListener("touchend", function () {
            if (!dragState) return;
            dragState.element.style.opacity = "";
            dragState = null;
          }, { passive: true });
        }
      }

      function createFieldRow(name, type, desc, level) {
        level = level || 0;
        var row = document.createElement("div");
        row.className = "field-row" + (level > 0 ? " field-row-nested" : "");
        row.dataset.level = level;
        row.draggable = true;

        var handle = document.createElement("span");
        handle.className = "drag-handle";
        handle.textContent = "\u22ee";

        var nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.className = "field-name";
        nameInput.placeholder = "field_name";
        nameInput.value = name || "";
        nameInput.addEventListener("input", function () {
          validateFieldName(this);
        });

        var typeSelect = document.createElement("select");
        typeSelect.className = "field-type";
        createTypeOptions(type, level).forEach(function (opt) { typeSelect.appendChild(opt); });

        var descInput = document.createElement("input");
        descInput.type = "text";
        descInput.className = "field-desc";
        descInput.placeholder = "Description";
        descInput.value = desc || "";
        descInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            var container = row.parentElement;
            var addBtn = findAddButton(container);
            var newRow = createFieldRow("", "str", "", level);
            if (addBtn) {
              container.insertBefore(newRow, addBtn);
            } else {
              container.insertBefore(newRow, row.nextSibling);
            }
            toggleEmptyState(container);
            newRow.querySelector(".field-name").focus();
          }
        });

        var toggleBtn = document.createElement("button");
        toggleBtn.type = "button";
        toggleBtn.className = "toggle-nested";
        toggleBtn.textContent = "\u25bc";
        toggleBtn.style.display = "none";

        var removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "remove-field";
        removeBtn.textContent = "\u00d7";

        row.appendChild(handle);
        row.appendChild(nameInput);
        row.appendChild(typeSelect);
        row.appendChild(descInput);
        row.appendChild(toggleBtn);
        row.appendChild(removeBtn);

        var nestedContainer = document.createElement("div");
        nestedContainer.className = "nested-fields";
        nestedContainer.style.display = "none";

        var nestedAddBtn = document.createElement("button");
        nestedAddBtn.type = "button";
        nestedAddBtn.className = "nested-add-field";
        nestedAddBtn.textContent = "+ Add sub-field";
        nestedAddBtn.addEventListener("click", function () {
          addField("", "str", "", level + 1, nestedContainer);
          nestedContainer.style.display = "block";
          toggleBtn.textContent = "\u25bc";
        });
        nestedContainer.appendChild(nestedAddBtn);
        row.appendChild(nestedContainer);

        typeSelect.addEventListener("change", function () {
          var val = this.value;
          var isNested = val === "Object" || val === "List[Object]";
          if (isNested) {
            nestedContainer.style.display = "block";
            toggleBtn.style.display = "";
            var rows = nestedContainer.querySelectorAll(":scope > .field-row");
            if (rows.length === 0) {
              addField("", "str", "", level + 1, nestedContainer);
            }
          } else {
            nestedContainer.style.display = "none";
            toggleBtn.style.display = "none";
          }
        });

        toggleBtn.addEventListener("click", function () {
          var hidden = nestedContainer.style.display === "none";
          nestedContainer.style.display = hidden ? "block" : "none";
          this.textContent = hidden ? "\u25bc" : "\u25b6";
        });

        removeBtn.addEventListener("click", function () {
          var parent = row.parentElement;
          row.remove();
          toggleEmptyState(parent);
        });

        makeFieldDraggable(row);

        return row;
      }

      function addField(name, type, desc, level, container) {
        container = container || fieldList;
        level = level || 0;
        var row = createFieldRow(name, type || "str", desc || "", level);
        var addBtn = findAddButton(container);
        if (addBtn) {
          container.insertBefore(row, addBtn);
        } else {
          container.appendChild(row);
        }
        toggleEmptyState(container);
      }

      function toggleEmptyState(container) {
        var rows = container.querySelectorAll(":scope > .field-row");
        var existing = container.querySelector(".empty-state");
        if (rows.length === 0) {
          if (!existing) {
            var el = document.createElement("div");
            el.className = "empty-state";
            el.textContent = 'No fields yet. Click "+ Add Field" to start.';
            var addBtn = findAddButton(container);
            if (addBtn) {
              container.insertBefore(el, addBtn);
            } else {
              container.appendChild(el);
            }
          }
        } else {
          if (existing) existing.remove();
        }
        if (container === fieldList) toggleGenerateButton();
      }

      function collectFields(container) {
        var fields = [];
        var rows = container.querySelectorAll(":scope > .field-row");
        rows.forEach(function (row) {
          var name = row.querySelector(".field-name").value.trim();
          if (!name) return;
          var type = row.querySelector(".field-type").value;
          var desc = row.querySelector(".field-desc").value.trim();
          var f = { name: name, type: type, desc: desc, children: [] };
          if (type === "Object" || type === "List[Object]") {
            var nc = row.querySelector(".nested-fields");
            if (nc) f.children = collectFields(nc);
          }
          fields.push(f);
        });
        return fields;
      }

      function fieldsHaveList(fields) {
        for (var i = 0; i < fields.length; i++) {
          var f = fields[i];
          if (f.type.indexOf("List") === 0) return true;
          if (f.children.length > 0 && fieldsHaveList(f.children)) return true;
        }
        return false;
      }

      function collectAllNames(fields) {
        var names = {};
        fields.forEach(function (f) {
          names[f.name] = (names[f.name] || 0) + 1;
          if (f.children.length > 0) {
            var childNames = collectAllNames(f.children);
            for (var k in childNames) {
              names[k] = (names[k] || 0) + childNames[k];
            }
          }
        });
        return names;
      }

      var nestedCounter = 0;
      var nestedDefs = [];

      function buildModel(modelName, fields) {
        var lines = [];
        lines.push("class " + modelName + "(BaseModel):");
        if (fields.length === 0) {
          lines.push("    pass");
        } else {
          fields.forEach(function (f) {
            var isNested = f.type === "Object" || f.type === "List[Object]";
            if (isNested) {
              nestedCounter++;
              var nestedName = "NestedModel" + nestedCounter;
              var prefix = f.type === "List[Object]" ? "List[" : "";
              var suffix = f.type === "List[Object]" ? "]" : "";
              lines.push("    " + f.name + ": " + prefix + nestedName + suffix + formatDesc(f.desc));
              buildModel(nestedName, f.children);
            } else {
              var pyType = TYPE_MAP[f.type] || "str";
              lines.push("    " + f.name + ": " + pyType + formatDesc(f.desc));
            }
          });
        }
        nestedDefs.push(lines.join("\n"));
      }

      function formatDesc(desc) {
        if (!desc) return "";
        return ' = Field(description="' + desc.replace(/"/g, '\\"') + '")';
      }

      function generateCode() {
        var fields = collectFields(document.getElementById("field-list"));
        var modelName = modelNameInput.value.trim() || "ExtractedData";

        var allNames = collectAllNames(fields);
        var dupes = [];
        for (var k in allNames) {
          if (allNames[k] > 1) dupes.push(k);
        }
        if (dupes.length > 0) {
          builderError.textContent = "Duplicate field names: " + dupes.join(", ") + " — each name must be unique.";
          builderError.style.display = "block";
          highlightDupes(fieldList);
          return;
        }
        builderError.style.display = "none";
        document.querySelectorAll(".field-name-invalid").forEach(function (el) {
          var val = el.value.trim();
          if (val && FIELD_NAME_RE.test(val)) {
            el.classList.remove("field-name-invalid");
          }
        });

        nestedCounter = 0;
        nestedDefs = [];

        buildModel(modelName, fields);

        var needsList = fieldsHaveList(fields);
        var imports = ["from pydantic import BaseModel, Field"];
        if (needsList) imports.push("from typing import List");

        textarea.value = imports.join("\n") + "\n\n" + nestedDefs.join("\n\n");
        switchTab("code");
      }

      function switchTab(tabId) {
        var tabs = document.querySelectorAll(".tab");
        tabs.forEach(function (t) {
          t.classList.toggle("active", t.dataset.tab === tabId);
        });
        var panels = document.querySelectorAll(".tab-panel");
        panels.forEach(function (p) {
          p.classList.toggle("active", p.id === "tab-" + tabId);
        });
      }

      document.querySelectorAll(".tab").forEach(function (tab) {
        tab.addEventListener("click", function () {
          switchTab(this.dataset.tab);
        });
      });

      document.getElementById("add-field").addEventListener("click", function () {
        addField("", "str", "");
      });

      document.getElementById("generate-code").addEventListener("click", generateCode);

      function populateNested(row, children, level) {
        var nc = row.querySelector(".nested-fields");
        var toggle = row.querySelector(".toggle-nested");
        if (!nc) return;
        nc.style.display = "block";
        if (toggle) toggle.style.display = "";
        nc.querySelectorAll(".field-row").forEach(function (r) { r.remove(); });
        children.forEach(function (child) {
          addField(child.name, child.type, child.description, level, nc);
          var rows = nc.querySelectorAll(":scope > .field-row");
          var last = rows[rows.length - 1];
          if (last && child.children) {
            populateNested(last, child.children, level + 1);
          }
        });
        toggleEmptyState(nc);
      }

      document.getElementById("import-code").addEventListener("click", function () {
        var code = textarea.value.trim();
        if (!code) return;
        fetch("/schemas/parse", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pydantic_schema: code }),
        }).then(function (r) {
          if (!r.ok) { r.json().then(function (e) { builderError.textContent = e.detail || "Parse failed"; builderError.style.display = "block"; }); return; }
          return r.json();
        }).then(function (data) {
          if (!data) return;
          builderError.style.display = "none";
          document.getElementById("model-name").value = data.model_name || "ExtractedData";
          var fl = document.getElementById("field-list");
          fl.querySelectorAll(".field-row").forEach(function (r) { r.remove(); });
          toggleEmptyState(fl);
          data.fields.forEach(function (f) {
            addField(f.name, f.type, f.description);
            var row = fl.querySelector(":scope > .field-row:last-child");
            if (row && f.children) {
              populateNested(row, f.children, 1);
            }
          });
          switchTab("builder");
        });
      });

      function loadTemplateList() {
        fetch("/schemas")
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var sel = document.getElementById("template-select");
            sel.innerHTML = '<option value="">Select a saved schema...</option>';
            data.forEach(function (s) {
              var opt = document.createElement("option");
              opt.value = s.id;
              opt.textContent = s.name;
              sel.appendChild(opt);
            });
          });
      }

      function getSelectedTemplateId() {
        var sel = document.getElementById("template-select");
        return sel.value || null;
      }

      function getSchemaById(id, data) {
        for (var i = 0; i < data.length; i++) {
          if (data[i].id === id) return data[i];
        }
        return null;
      }

      document.getElementById("template-save").addEventListener("click", function () {
        var code = textarea.value.trim();
        if (!code) { alert("No schema code to save. Build a schema first."); return; }
        var name = prompt("Name for this schema:");
        if (!name || !name.trim()) return;
        fetch("/schemas", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: name.trim(), pydantic_schema: code }),
        }).then(function (r) {
          if (!r.ok) { r.json().then(function (e) { alert(e.detail); }); return; }
          loadTemplateList();
        });
      });

      document.getElementById("template-load").addEventListener("click", function () {
        var id = getSelectedTemplateId();
        if (!id) { alert("Select a schema first."); return; }
        fetch("/schemas/" + id)
          .then(function (r) { return r.json(); })
          .then(function (s) {
            textarea.value = s.pydantic_schema;
            switchTab("code");
          });
      });

      document.getElementById("template-delete").addEventListener("click", function () {
        var id = getSelectedTemplateId();
        if (!id) { alert("Select a schema first."); return; }
        if (!confirm("Delete this schema?")) return;
        fetch("/schemas/" + id, { method: "DELETE" }).then(function () {
          loadTemplateList();
        });
      });

      document.getElementById("template-export").addEventListener("click", function () {
        var id = getSelectedTemplateId();
        if (!id) { alert("Select a schema first."); return; }
        window.open("/schemas/" + id + "/export", "_blank");
      });

      document.getElementById("template-import").addEventListener("click", function () {
        document.getElementById("template-import-input").click();
      });

      document.getElementById("template-import-input").addEventListener("change", function () {
        var file = this.files[0];
        if (!file) return;
        var formData = new FormData();
        formData.append("file", file);
        fetch("/schemas/import", { method: "POST", body: formData })
          .then(function (r) {
            if (!r.ok) { r.json().then(function (e) { alert(e.detail); }); return; }
            loadTemplateList();
          });
        this.value = "";
      });

      function loadModels() {
        fetch("/models")
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var sel = document.getElementById("model-select");
            sel.innerHTML = '<option value="">Select a model...</option>';
            var grouped = {};
            data.models.forEach(function (m) {
              var conn = m.connection || "";
              if (!grouped[conn]) grouped[conn] = [];
              grouped[conn].push(m);
            });
            var connOrder = Object.keys(grouped).sort(function (a, b) {
              if (a === "ollama") return -1;
              if (b === "ollama") return 1;
              return a.localeCompare(b);
            });
            connOrder.forEach(function (conn) {
              var grp = document.createElement("optgroup");
              grp.label = conn;
              grouped[conn].forEach(function (m) {
                var opt = document.createElement("option");
                opt.value = m.id;
                var caps = (m.capabilities || []).join("/");
                opt.textContent = m.model + " (" + caps + ")";
                grp.appendChild(opt);
              });
              sel.appendChild(grp);
            });
            if (data.models.length > 0) {
              var saved = sessionStorage.getItem('smd_last_model');
              var found = false;
              if (saved) {
                for (var i = 0; i < sel.options.length; i++) {
                  if (sel.options[i].value === saved) {
                    sel.value = saved;
                    found = true;
                    break;
                  }
                }
              }
              if (!found) sel.value = data.models[0].id;
            }
          });
      }

      toggleGenerateButton();
      addField("names", "List[str]", "Full names of all people");
      addField("positions", "List[str]", "Positions in same order");
      modelNameInput.value = "OfficialsList";
      toggleGenerateButton();
      loadTemplateList();
      loadModels();

      var lastSchema = sessionStorage.getItem('smd_last_schema');
      if (lastSchema) {
        var ta = document.querySelector("textarea[name='pydantic_schema']");
        if (ta) { ta.value = lastSchema; switchTab('code'); }
      }

      document.querySelector('form').addEventListener('htmx:beforeRequest', function() {
        var sel = document.getElementById('model-select');
        if (sel) sessionStorage.setItem('smd_last_model', sel.value);
        var ta = document.querySelector("textarea[name='pydantic_schema']");
        if (ta) sessionStorage.setItem('smd_last_schema', ta.value);
      });
    })();
  </script>
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'light';
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      var btn = document.getElementById('theme-btn');
      if (btn) {
        btn.textContent = theme === 'dark' ? '\u2600\uFE0F' : '\uD83C\uDF19';
        btn.addEventListener('click', function() {
          var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          btn.textContent = next === 'dark' ? '\u2600\uFE0F' : '\uD83C\uDF19';
        });
      }
    })();
  </script>
  <script>
    fetch('/auth/me').then(function(r) { return r.json(); }).then(function(u) {
      if (u.role === 'admin') {
        document.getElementById('admin-link').style.display = 'inline';
        document.getElementById('usage-link').href = '/admin/usage';
      }
    });
  </script>
</body>
