<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Struct My Data</title>
  <script src="https://unpkg.com/htmx.org@2"></script>
  <style>
    body {
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      color: #1a1a1a;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-weight: 600;
      font-size: 0.875rem;
    }
    input[type="file"], textarea {
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.875rem;
    }
    textarea {
      font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
      font-size: 0.8rem;
      box-sizing: border-box;
      width: 100%;
    }
    button {
      padding: 0.6rem 1.2rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
      align-self: flex-start;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: default; }
    .htmx-request button { opacity: 0.7; pointer-events: none; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline; }
    .htmx-request .button-label { display: none; }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 1rem;
      font-size: 0.875rem;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 0.5rem;
      text-align: left;
      vertical-align: top;
    }
    th { background: #f5f5f5; font-weight: 600; }
    td pre { margin: 0; font-size: 0.8rem; }
    #result { margin-top: 1rem; }
    .error {
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 0.75rem;
      border-radius: 4px;
    }

    .tab-bar {
      display: flex;
      gap: 0;
      border-bottom: 2px solid #e5e7eb;
      margin-bottom: 0.75rem;
    }
    .tab {
      padding: 0.5rem 1rem;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      color: #6b7280;
      font-size: 0.875rem;
      cursor: pointer;
      margin-bottom: -2px;
    }
    .tab.active {
      background: #fff;
      color: #1a1a1a;
      border-bottom: 2px solid #2563eb;
      font-weight: 600;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .model-name-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .model-name-row label {
      flex-shrink: 0;
      font-size: 0.875rem;
    }
    .model-name-row input {
      flex: 1;
      max-width: 300px;
      padding: 0.4rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.875rem;
      font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
    }

    .field-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .field-row {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .field-row input, .field-row select {
      padding: 0.4rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .field-row .field-name {
      flex: 0 0 150px;
      font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
    }
    .field-row .field-type {
      flex: 0 0 140px;
    }
    .field-row .field-desc {
      flex: 1 1 180px;
    }
    .field-row .remove-field {
      padding: 0.2rem 0.5rem;
      background: transparent;
      color: #9ca3af;
      font-size: 1.1rem;
      line-height: 1;
      align-self: center;
    }
    .field-row .remove-field:hover {
      color: #b91c1c;
      background: transparent;
    }

    .builder-actions {
      display: flex;
      gap: 0.5rem;
    }
    .btn-secondary {
      background: #6b7280;
    }
    .btn-secondary:hover { background: #4b5563; }

    .empty-state {
      color: #9ca3af;
      font-size: 0.875rem;
      font-style: italic;
      padding: 0.5rem 0;
    }
  </style>
</head>
<body>
  <h1>Struct My Data</h1>
  <form hx-post="/ui/extract" hx-target="#result" enctype="multipart/form-data">
    <div>
      <label>Document <input type="file" name="file" required></label>
    </div>
    <div class="schema-section">
      <label>Pydantic Schema</label>
      <div class="tab-bar">
        <button type="button" class="tab active" data-tab="builder">Builder</button>
        <button type="button" class="tab" data-tab="code">Code</button>
      </div>
      <div class="tab-panel active" id="tab-builder">
        <div class="builder">
          <div class="model-name-row">
            <label for="model-name">Model Name</label>
            <input type="text" id="model-name" value="ExtractedData">
          </div>
          <div class="field-list" id="field-list"></div>
          <div class="builder-actions">
            <button type="button" id="add-field">+ Add Field</button>
            <button type="button" id="generate-code" class="btn-secondary">Generate Code</button>
          </div>
        </div>
      </div>
      <div class="tab-panel" id="tab-code">
        <textarea name="pydantic_schema" rows="10">from pydantic import BaseModel, Field
from typing import List

class OfficialsList(BaseModel):
    names: List[str] = Field(description="Full names of all people")
    positions: List[str] = Field(description="Positions in same order")</textarea>
      </div>
    </div>
    <button type="submit">
      <span class="button-label">Extract</span>
      <span class="htmx-indicator">⏳ Extracting...</span>
    </button>
  </form>
  <div id="result"></div>

  <script>
    (function () {
      var TYPE_MAP = {
        str: "str",
        int: "int",
        float: "float",
        bool: "bool",
        date: "str",
        "List[str]": "List[str]",
        "List[float]": "List[float]",
        "List[int]": "List[int]",
      };

      var fieldList = document.getElementById("field-list");
      var modelNameInput = document.getElementById("model-name");
      var textarea = document.querySelector("textarea[name='pydantic_schema']");

      function createFieldRow(name, type, desc) {
        var row = document.createElement("div");
        row.className = "field-row";

        var nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.className = "field-name";
        nameInput.placeholder = "field_name";
        nameInput.value = name || "";

        var typeSelect = document.createElement("select");
        typeSelect.className = "field-type";
        var types = [
          ["str", "string"],
          ["int", "integer"],
          ["float", "number"],
          ["bool", "boolean"],
          ["date", "date"],
          ["List[str]", "list of string"],
          ["List[float]", "list of number"],
          ["List[int]", "list of integer"],
        ];
        types.forEach(function (t) {
          var opt = document.createElement("option");
          opt.value = t[0];
          opt.textContent = t[1];
          if (t[0] === (type || "str")) opt.selected = true;
          typeSelect.appendChild(opt);
        });

        var descInput = document.createElement("input");
        descInput.type = "text";
        descInput.className = "field-desc";
        descInput.placeholder = "Description";
        descInput.value = desc || "";

        var removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "remove-field";
        removeBtn.textContent = "\u00d7";
        removeBtn.addEventListener("click", function () {
          row.remove();
          toggleEmptyState();
        });

        row.appendChild(nameInput);
        row.appendChild(typeSelect);
        row.appendChild(descInput);
        row.appendChild(removeBtn);
        return row;
      }

      function addField(name, type, desc) {
        var row = createFieldRow(name, type, desc);
        fieldList.appendChild(row);
        toggleEmptyState();
      }

      function toggleEmptyState() {
        var existing = fieldList.querySelector(".empty-state");
        if (fieldList.children.length === 0) {
          if (!existing) {
            var el = document.createElement("div");
            el.className = "empty-state";
            el.textContent = "No fields yet. Click \"+ Add Field\" to start.";
            fieldList.appendChild(el);
          }
        } else {
          if (existing) existing.remove();
        }
      }

      function getNeedsListImport() {
        var rows = fieldList.querySelectorAll(".field-row");
        for (var i = 0; i < rows.length; i++) {
          var sel = rows[i].querySelector(".field-type");
          if (sel && sel.value.indexOf("List") === 0) return true;
        }
        return false;
      }

      function generateCode() {
        var rows = fieldList.querySelectorAll(".field-row");
        var modelName = modelNameInput.value.trim() || "ExtractedData";
        var needsList = getNeedsListImport();
        var lines = [];

        var imports = ["from pydantic import BaseModel, Field"];
        if (needsList) imports.push("from typing import List");
        lines.push(imports.join("\n"));
        lines.push("");
        lines.push("");
        lines.push("class " + modelName + "(BaseModel):");

        if (rows.length === 0) {
          lines.push("    pass");
        } else {
          rows.forEach(function (row) {
            var name = row.querySelector(".field-name").value.trim();
            if (!name) return;
            var typeVal = row.querySelector(".field-type").value;
            var desc = row.querySelector(".field-desc").value.trim();
            var pyType = TYPE_MAP[typeVal] || "str";
            var line = "    " + name + ": " + pyType;
            if (desc) {
              line += " = Field(description=\"" + desc.replace(/"/g, '\\"') + "\")";
            }
            lines.push(line);
          });
        }

        lines.push("");
        textarea.value = lines.join("\n");
        switchTab("code");
      }

      function switchTab(tabId) {
        var tabs = document.querySelectorAll(".tab");
        tabs.forEach(function (t) {
          t.classList.toggle("active", t.dataset.tab === tabId);
        });
        var panels = document.querySelectorAll(".tab-panel");
        panels.forEach(function (p) {
          p.classList.toggle("active", p.id === "tab-" + tabId);
        });
      }

      document.querySelectorAll(".tab").forEach(function (tab) {
        tab.addEventListener("click", function () {
          switchTab(this.dataset.tab);
        });
      });

      document.getElementById("add-field").addEventListener("click", function () {
        addField("", "str", "");
      });

      document.getElementById("generate-code").addEventListener("click", generateCode);

      addField("names", "List[str]", "Full names of all people");
      addField("positions", "List[str]", "Positions in same order");
      modelNameInput.value = "OfficialsList";
    })();
  </script>
</body>
</html>
