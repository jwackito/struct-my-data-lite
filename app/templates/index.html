<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Struct My Data</title>
  <script src="/i18n.js"></script>
  <script src="https://unpkg.com/htmx.org@2"></script>
  <style>
    body {
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      color: #1a1a1a;
    }
    @media (min-width: 1024px) {
      body { max-width: 1200px; }
    }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-weight: 600;
      font-size: 0.875rem;
    }
    input[type="file"], textarea {
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.875rem;
    }
    textarea {
      font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
      font-size: 0.8rem;
      box-sizing: border-box;
      width: 100%;
    }
    button {
      padding: 0.6rem 1.2rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
      align-self: flex-start;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: default; }
    .htmx-request button { opacity: 0.7; pointer-events: none; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline; }
    .htmx-request .button-label { display: none; }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 1rem;
      font-size: 0.875rem;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 0.5rem;
      text-align: left;
      vertical-align: top;
    }
    th { background: #f5f5f5; font-weight: 600; }
    td pre { margin: 0; font-size: 0.8rem; }
    #result { margin-top: 1rem; }
    .error {
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 0.75rem;
      border-radius: 4px;
    }

    .tab-bar {
      display: flex;
      gap: 0;
      border-bottom: 2px solid #e5e7eb;
      margin-bottom: 0.75rem;
    }
    .tab {
      padding: 0.5rem 1rem;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      color: #6b7280;
      font-size: 0.875rem;
      cursor: pointer;
      margin-bottom: -2px;
    }
    .tab.active {
      background: #fff;
      color: #1a1a1a;
      border-bottom: 2px solid #2563eb;
      font-weight: 600;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    select#model-select {
      padding: 0.4rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.875rem;
      font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
      max-width: 100%;
    }

    .model-name-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .model-name-row label {
      flex-shrink: 0;
      font-size: 0.875rem;
    }
    .model-name-row input {
      flex: 1;
      max-width: 300px;
      padding: 0.4rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.875rem;
      font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
    }

    .field-separator {
      height: 1px;
      background: #e5e7eb;
      margin: 0.5rem 0;
    }

    .field-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .field-row {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .field-row input, .field-row select {
      padding: 0.4rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .field-row .drag-handle {
      flex: 0 0 16px;
      padding: 0.2rem 0;
      cursor: grab;
      color: #9ca3af;
      font-size: 0.85rem;
      text-align: center;
      user-select: none;
      align-self: center;
      line-height: 1;
      touch-action: none;
    }
    .field-row .drag-handle:active { cursor: grabbing; }
    .field-row .field-name {
      flex: 1 1 150px;
      max-width: 240px;
      font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
    }
    .field-row .field-name-invalid {
      border-color: #ef4444;
      background: #fef2f2;
    }
    .field-row .field-type {
      flex: 0 0 140px;
    }
    .field-row .field-desc {
      flex: 1 1 180px;
    }
    .field-row .remove-field {
      padding: 0.2rem 0.5rem;
      background: transparent;
      color: #9ca3af;
      font-size: 1.1rem;
      line-height: 1;
      align-self: center;
    }
    .field-row .remove-field:hover {
      color: #b91c1c;
      background: transparent;
    }
    .field-row .toggle-nested {
      padding: 0.15rem 0.35rem;
      background: transparent;
      color: #6b7280;
      font-size: 0.65rem;
      cursor: pointer;
      border: 1px solid #d1d5db;
      border-radius: 3px;
      align-self: center;
      line-height: 1;
    }
    .field-row .toggle-nested:hover {
      background: #f3f4f6;
    }

    .field-row.dragging {
      opacity: 0.4;
    }

    .field-row-nested {
      margin-left: 0.5rem;
    }
    .field-row-nested input, .field-row-nested select {
      font-size: 0.75rem;
    }
    .field-row-nested .field-name { flex: 0 0 130px; }
    .field-row-nested .field-type { flex: 0 0 120px; }
    .field-row-nested .field-desc { flex: 1 1 140px; }

    .nested-fields {
      flex: 0 0 100%;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin: 0.4rem 0 0.2rem 1.2rem;
      padding: 0.5rem 0.5rem 0.5rem 0.75rem;
      border-left: 2px solid #e5e7eb;
      background: #fafafa;
      border-radius: 0 4px 4px 0;
    }
    .nested-add-field {
      padding: 0.25rem 0.6rem;
      background: transparent;
      color: #6b7280;
      font-size: 0.75rem;
      border: 1px dashed #d1d5db;
      border-radius: 3px;
      cursor: pointer;
      align-self: flex-start;
    }
    .nested-add-field:hover {
      background: #f3f4f6;
      color: #1a1a1a;
    }

    @media (max-width: 640px) {
      .field-row .field-desc { flex: 1 1 100%; }
      .field-row-nested { margin-left: 0; }
      .nested-fields { margin-left: 0.5rem; }
    }

    .builder-actions {
      display: flex;
      gap: 0.5rem;
    }
    .btn-secondary {
      background: #6b7280;
    }
    .btn-secondary:hover { background: #4b5563; }

    .empty-state {
      color: #9ca3af;
      font-size: 0.875rem;
      font-style: italic;
      padding: 0.5rem 0;
    }

    .validation-error {
      color: #dc2626;
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }

    .schema-templates {
      margin-top: 1rem;
      border-top: 1px solid #e5e7eb;
      padding-top: 0.75rem;
    }
    .templates-row {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .templates-row select {
      flex: 1;
      min-width: 180px;
      padding: 0.4rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .templates-row button, .templates-import-row button {
      font-size: 0.8rem;
      padding: 0.4rem 0.7rem;
    }
    .templates-import-row {
      margin-top: 0.4rem;
    }
    .btn-danger {
      background: #dc2626;
    }
    .btn-danger:hover { background: #b91c1c; }
    .builder-help {
      font-size: 0.85rem;
      color: #6b7280;
      margin: 0 0 0.75rem;
    }
    .field-header {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      padding: 0 0 0.25rem;
      font-size: 0.72rem;
      color: #6b7280;
      font-weight: 600;
    }
    .field-header .fh-spacer { flex: 0 0 16px; }
    .field-header .fh-name { flex: 0 0 130px; }
    .field-header .fh-type { flex: 0 0 105px; }
    .field-header .fh-opt { flex: 0 0 18px; text-align: center; }
    .field-header .fh-default { flex: 0 0 80px; }
    .field-header .fh-desc { flex: 1 1 120px; }

    .field-row .field-name { flex: 0 0 130px; }
    .field-row .field-type { flex: 0 0 105px; }
    .field-row .field-optional { flex: 0 0 18px; width: 16px; height: 16px; cursor: pointer; align-self: center; }
    .field-row .field-default {
      flex: 0 0 80px;
      padding: 0.4rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .field-row .field-desc { flex: 1 1 120px; }

    .field-row-nested .field-name { flex: 0 0 110px; }
    .field-row-nested .field-type { flex: 0 0 95px; }
    .field-row-nested .field-default { flex: 0 0 70px; }
    .field-row-nested .field-desc { flex: 1 1 100px; }

    .advanced-section {
      margin-top: 0.75rem;
      border-top: 1px solid #e5e7eb;
      padding-top: 0.5rem;
    }
    .advanced-toggle {
      background: transparent;
      color: #6b7280;
      border: none;
      padding: 0.25rem 0;
      font-size: 0.8rem;
      cursor: pointer;
      align-self: flex-start;
    }
    .advanced-toggle:hover { color: #1a1a1a; background: transparent; }
    .advanced-status {
      font-size: 0.75rem;
      color: #6b7280;
      margin: 0.25rem 0;
    }
    .advanced-status.manual { color: #b45309; }
    #advanced-panel textarea {
      font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
      font-size: 0.8rem;
      width: 100%;
      box-sizing: border-box;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .advanced-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.4rem;
    }
    .advanced-actions button { font-size: 0.8rem; padding: 0.4rem 0.7rem; }

    [data-theme="dark"] .builder-help, [data-theme="dark"] .field-header, [data-theme="dark"] .advanced-status { color: #9ca3af; }
    [data-theme="dark"] .advanced-status.manual { color: #fbbf24; }
    [data-theme="dark"] .field-row .field-default, [data-theme="dark"] #advanced-panel textarea { background: #2d2d2d; color: #e5e5e5; border-color: #555; }
    [data-theme="dark"] .advanced-toggle { color: #9ca3af; }
    [data-theme="dark"] .advanced-toggle:hover { color: #e5e5e5; }

    .theme-btn { background: none; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; padding: 0.25rem 0.5rem; font-size: 1rem; line-height: 1; }
    [data-theme="dark"] body { background: #1a1a1a; color: #e5e5e5; }
    [data-theme="dark"] a { color: #60a5fa; }
    [data-theme="dark"] .theme-btn { border-color: #555; }
    [data-theme="dark"] input[type="file"], [data-theme="dark"] textarea, [data-theme="dark"] select#model-select, [data-theme="dark"] .field-row input, [data-theme="dark"] .templates-row input { background: #2d2d2d; color: #e5e5e5; border-color: #555; }
    [data-theme="dark"] .tab-bar { border-bottom-color: #404040; }
    [data-theme="dark"] .tab { background: #2d2d2d; border-color: #404040; color: #9ca3af; }
    [data-theme="dark"] .tab.active { background: #1a1a1a; color: #e5e5e5; }
    [data-theme="dark"] th, [data-theme="dark"] td { border-color: #404040; }
    [data-theme="dark"] th { background: #2d2d2d; }
    [data-theme="dark"] .error { color: #fca5a5; background: #3b1a1a; border-color: #7f1d1d; }
    [data-theme="dark"] .btn:hover, [data-theme="dark"] #add-field:hover { background: #3b82f6; }
    [data-theme="dark"] .field-row .remove-field:hover { color: #fca5a5; }
    [data-theme="dark"] .validation-error { color: #fca5a5; background: #3b1a1a; border-color: #7f1d1d; }
    [data-theme="dark"] .schema-templates .templates-row button { background: #2d2d2d; color: #e5e5e5; border-color: #555; }
  </style>
</head>
<body>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem">
    <h1 style="margin:0">Struct My Data</h1>
    <div style="display:flex;gap:0.5rem;align-items:center">
      <div id="lang-switcher"></div>
      <a id="admin-link" href="/admin" style="display:none;font-size:0.85rem;text-decoration:none" data-i18n="Admin">Admin</a>
      <a id="usage-link" href="/usage" style="font-size:0.85rem;text-decoration:none" data-i18n="Usage">Usage</a>
      <button id="theme-btn" class="theme-btn" title="Toggle theme" data-i18n-title="Toggle theme">&#x1F319;</button>
      <a href="/ui/settings" style="font-size:1.3rem;text-decoration:none;color:#6b7280" title="Settings" data-i18n-title="Settings">&#9881;</a>
      <a href="#" onclick="fetch('/auth/logout',{method:'POST'}).then(function(){window.location.href='/login'});return false" style="font-size:0.85rem;text-decoration:none" data-i18n="Logout">Logout</a>
    </div>
  </div>
  <form hx-post="/ui/batch-extract" hx-target="#result" enctype="multipart/form-data">
    <div>
      <label><span data-i18n="Document">Document</span> <input type="file" name="file" multiple required></label>
    </div>
    <div>
      <label><span data-i18n="Model">Model</span>
        <select name="model_id" id="model-select">
          <option value="">Loading models...</option>
        </select>
      </label>
    </div>
    <div class="schema-section">
      <label data-i18n="Fields to Extract">Fields to Extract</label>
      <div class="tab-bar">
        <button type="button" class="tab active" data-tab="builder" data-i18n="Builder">Builder</button>
        <button type="button" class="tab" data-tab="history" hx-get="/ui/jobs" hx-target="#tab-history" hx-trigger="click once" data-i18n="History">History</button>
      </div>
      <div class="tab-panel active" id="tab-builder">
        <div class="builder">
          <p class="builder-help" data-i18n="Describe the data you want to extract. Add one row per field.">Describe the data you want to extract. Add one row per field.</p>
          <div class="model-name-row">
            <label for="model-name" data-i18n="Model Name">Model Name</label>
            <input type="text" id="model-name" value="ExtractedData">
          </div>
          <div class="field-separator"></div>
          <div class="field-header">
            <span class="fh-spacer"></span>
            <span class="fh-name" data-i18n="Field name">Field name</span>
            <span class="fh-type" data-i18n="Type">Type</span>
            <span class="fh-opt" data-i18n="Opt" data-i18n-title="Optional field">Opt</span>
            <span class="fh-default" data-i18n="Default">Default</span>
            <span class="fh-desc" data-i18n="Description">Description</span>
            <span class="fh-spacer"></span>
          </div>
          <div class="field-list" id="field-list"></div>
          <div class="builder-actions">
            <button type="button" id="add-field" data-i18n="+ Add Field">+ Add Field</button>
          </div>
          <div id="builder-error" class="validation-error" style="display:none"></div>
        </div>
      </div>
      <div class="schema-templates">
        <label data-i18n="Saved Schemas">Saved Schemas</label>
        <div class="templates-row">
          <select id="template-select">
            <option value="" data-i18n="Select a saved schema...">Select a saved schema...</option>
          </select>
          <button type="button" id="template-load" data-i18n="Load">Load</button>
          <button type="button" id="template-save" class="btn-secondary" data-i18n="Save">Save</button>
          <button type="button" id="template-delete" class="btn-danger">&times;</button>
          <button type="button" id="template-export" class="btn-secondary" data-i18n="Export">Export</button>
        </div>
      <div class="templates-import-row">
        <button type="button" id="template-import" class="btn-secondary" data-i18n="Import .py file...">Import .py file...</button>
        <input type="file" id="template-import-input" accept=".py,.json,.txt" style="display:none">
      </div>
      <div class="advanced-section">
        <button type="button" id="advanced-toggle" class="advanced-toggle">
          <span id="advanced-caret">&#9656;</span> <span data-i18n="Advanced">Advanced</span>
        </button>
        <div id="advanced-panel" style="display:none">
          <div id="advanced-status" class="advanced-status"></div>
          <textarea name="pydantic_schema" id="schema-code" rows="10" spellcheck="false"></textarea>
          <div class="advanced-actions">
            <button type="button" id="code-from-builder" class="btn-secondary" data-i18n="Refresh from builder">Refresh from builder</button>
            <button type="button" id="code-to-builder" class="btn-secondary" data-i18n="Import into builder">Import into builder</button>
          </div>
        </div>
      </div>
    </div>
    </div>
    <button type="submit">
      <span class="button-label" data-i18n="Extract">Extract</span>
      <span class="htmx-indicator">⏳ <span data-i18n="Extracting...">Extracting...</span></span>
    </button>
  </form>
  <div id="result"></div>
  <div class="tab-panel" id="tab-history"></div>

  <script>
    (function () {
      var SIMPLE_TYPES = [
        ["str", "string"],
        ["int", "integer"],
        ["float", "number"],
        ["bool", "boolean"],
        ["date", "date"],
        ["datetime", "datetime"],
        ["List[str]", "list of string"],
        ["List[int]", "list of integer"],
        ["List[float]", "list of number"],
        ["List[bool]", "list of boolean"],
        ["List[date]", "list of date"],
        ["List[datetime]", "list of datetime"],
      ];

      var OBJECT_TYPES = [
        ["Object", "Object"],
        ["List[Object]", "List of Object"],
      ];

      var NESTED = { "Object": true, "List[Object]": true };

      var fieldList = document.getElementById("field-list");
      var modelNameInput = document.getElementById("model-name");
      var textarea = document.querySelector("textarea[name='pydantic_schema']");
      var builderError = document.getElementById("builder-error");
      var advancedPanel = document.getElementById("advanced-panel");

      var FIELD_NAME_RE = /^[a-zA-Z_][a-zA-Z0-9_]*$/;

      var dragState = null;
      var manualCode = false;

      function findAddButton(container) {
        var children = container.children;
        for (var i = 0; i < children.length; i++) {
          if (children[i].classList.contains("nested-add-field")) {
            return children[i];
          }
        }
        return null;
      }

      function createTypeOptions(selected, level) {
        var types = SIMPLE_TYPES.slice();
        if (level < 2) types = types.concat(OBJECT_TYPES);
        return types.map(function (t) {
          var opt = document.createElement("option");
          opt.value = t[0];
          opt.textContent = window.t(t[1]);
          if (t[0] === (selected || "str")) opt.selected = true;
          return opt;
        });
      }

      function advancedPanelOpen() {
        return advancedPanel && advancedPanel.style.display !== "none";
      }

      function maybeRefreshPreview() {
        if (!manualCode && advancedPanelOpen()) refreshPreview();
      }

      function toggleGenerateButton() {
        maybeRefreshPreview();
      }

      function validateFieldName(input) {
        var val = input.value.trim();
        if (val && !FIELD_NAME_RE.test(val)) {
          input.classList.add("field-name-invalid");
        } else {
          input.classList.remove("field-name-invalid");
        }
      }

      function makeFieldDraggable(row) {
        var handle = row.querySelector(".drag-handle");
        if (!handle) return;

        handle.addEventListener("pointerdown", function (e) {
          if (e.pointerType === "mouse" && e.button !== 0) return;
          var container = row.parentElement;
          if (!container.classList.contains("field-list") && !container.classList.contains("nested-fields")) return;
          dragState = { row: row, container: container, started: false };
          handle.setPointerCapture(e.pointerId);
          e.preventDefault();
        });

        handle.addEventListener("pointermove", function (e) {
          if (!dragState) return;
          if (!dragState.started) {
            dragState.started = true;
            row.classList.add("dragging");
            document.body.style.userSelect = "none";
          }
          var rows = dragState.container.querySelectorAll(":scope > .field-row");
          var insertBefore = null;
          for (var i = 0; i < rows.length; i++) {
            var r = rows[i];
            if (r === dragState.row) continue;
            var rect = r.getBoundingClientRect();
            if (e.clientY < rect.top + rect.height / 2) {
              insertBefore = r;
              break;
            }
          }
          if (insertBefore) {
            if (insertBefore.previousElementSibling !== dragState.row) {
              dragState.container.insertBefore(dragState.row, insertBefore);
            }
          } else if (dragState.row.nextElementSibling) {
            dragState.container.appendChild(dragState.row);
          }
        });

        function endDrag() {
          if (!dragState) return;
          dragState.row.classList.remove("dragging");
          document.body.style.userSelect = "";
          dragState = null;
          maybeRefreshPreview();
        }

        handle.addEventListener("pointerup", endDrag);
        handle.addEventListener("pointercancel", endDrag);
      }

      function createFieldRow(name, type, desc, optional, defaultVal, level) {
        level = level || 0;
        var row = document.createElement("div");
        row.className = "field-row" + (level > 0 ? " field-row-nested" : "");
        row.dataset.level = level;

        var handle = document.createElement("span");
        handle.className = "drag-handle";
        handle.textContent = "\u22ee";

        var nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.className = "field-name";
        nameInput.placeholder = "field_name";
        nameInput.value = name || "";
        nameInput.addEventListener("input", function () {
          validateFieldName(this);
        });

        var typeSelect = document.createElement("select");
        typeSelect.className = "field-type";
        createTypeOptions(type, level).forEach(function (opt) { typeSelect.appendChild(opt); });

        var optInput = document.createElement("input");
        optInput.type = "checkbox";
        optInput.className = "field-optional";
        optInput.checked = !!optional;
        optInput.title = window.t("Optional field");

        var defaultInput = document.createElement("input");
        defaultInput.type = "text";
        defaultInput.className = "field-default";
        defaultInput.placeholder = window.t("default");
        defaultInput.value = defaultVal || "";

        var descInput = document.createElement("input");
        descInput.type = "text";
        descInput.className = "field-desc";
        descInput.placeholder = window.t("Description");
        descInput.value = desc || "";
        descInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            var container = row.parentElement;
            var addBtn = findAddButton(container);
            var newRow = createFieldRow("", "str", "", false, "", level);
            if (addBtn) {
              container.insertBefore(newRow, addBtn);
            } else {
              container.insertBefore(newRow, row.nextSibling);
            }
            toggleEmptyState(container);
            newRow.querySelector(".field-name").focus();
          }
        });

        var toggleBtn = document.createElement("button");
        toggleBtn.type = "button";
        toggleBtn.className = "toggle-nested";
        toggleBtn.textContent = "\u25bc";
        toggleBtn.style.display = "none";

        var removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "remove-field";
        removeBtn.textContent = "\u00d7";

        row.appendChild(handle);
        row.appendChild(nameInput);
        row.appendChild(typeSelect);
        row.appendChild(optInput);
        row.appendChild(defaultInput);
        row.appendChild(descInput);
        row.appendChild(toggleBtn);
        row.appendChild(removeBtn);

        var nestedContainer = document.createElement("div");
        nestedContainer.className = "nested-fields";
        nestedContainer.style.display = "none";

        var nestedAddBtn = document.createElement("button");
        nestedAddBtn.type = "button";
        nestedAddBtn.className = "nested-add-field";
        nestedAddBtn.textContent = window.t("+ Add sub-field");
        nestedAddBtn.addEventListener("click", function () {
          addField("", "str", "", false, "", level + 1, nestedContainer);
          nestedContainer.style.display = "block";
          toggleBtn.textContent = "\u25bc";
        });
        nestedContainer.appendChild(nestedAddBtn);
        row.appendChild(nestedContainer);

        function syncDefaultVisibility() {
          defaultInput.style.display = NESTED[typeSelect.value] ? "none" : "";
        }

        typeSelect.addEventListener("change", function () {
          var val = this.value;
          var isNested = NESTED[val];
          if (isNested) {
            defaultInput.value = "";
            nestedContainer.style.display = "block";
            toggleBtn.style.display = "";
            var rows = nestedContainer.querySelectorAll(":scope > .field-row");
            if (rows.length === 0) {
              addField("", "str", "", false, "", level + 1, nestedContainer);
            }
          } else {
            nestedContainer.style.display = "none";
            toggleBtn.style.display = "none";
          }
          syncDefaultVisibility();
          maybeRefreshPreview();
        });

        toggleBtn.addEventListener("click", function () {
          var hidden = nestedContainer.style.display === "none";
          nestedContainer.style.display = hidden ? "block" : "none";
          this.textContent = hidden ? "\u25bc" : "\u25b6";
        });

        removeBtn.addEventListener("click", function () {
          var parent = row.parentElement;
          row.remove();
          toggleEmptyState(parent);
          maybeRefreshPreview();
        });

        syncDefaultVisibility();
        makeFieldDraggable(row);

        return row;
      }

      function addField(name, type, desc, optional, defaultVal, level, container) {
        container = container || fieldList;
        level = level || 0;
        var row = createFieldRow(name, type || "str", desc || "", optional, defaultVal, level);
        var addBtn = findAddButton(container);
        if (addBtn) {
          container.insertBefore(row, addBtn);
        } else {
          container.appendChild(row);
        }
        toggleEmptyState(container);
        return row;
      }

      function addFieldFromData(f, level, container) {
        var row = addField(f.name, f.type, f.description, f.optional, f["default"], level, container);
        if (row && NESTED[f.type] && f.children && f.children.length) {
          var nc = row.querySelector(".nested-fields");
          if (nc) {
            nc.style.display = "block";
            var toggle = row.querySelector(".toggle-nested");
            if (toggle) toggle.style.display = "";
            f.children.forEach(function (c) { addFieldFromData(c, level + 1, nc); });
            toggleEmptyState(nc);
          }
        }
        return row;
      }

      function populateBuilder(modelName, fields) {
        modelNameInput.value = modelName || "ExtractedData";
        fieldList.querySelectorAll(".field-row").forEach(function (r) { r.remove(); });
        toggleEmptyState(fieldList);
        (fields || []).forEach(function (f) { addFieldFromData(f, 0, fieldList); });
        maybeRefreshPreview();
      }

      function toggleEmptyState(container) {
        var rows = container.querySelectorAll(":scope > .field-row");
        var existing = container.querySelector(".empty-state");
        if (rows.length === 0) {
          if (!existing) {
            var el = document.createElement("div");
            el.className = "empty-state";
            el.textContent = window.t('No fields yet. Click "+ Add Field" to start.');
            var addBtn = findAddButton(container);
            if (addBtn) {
              container.insertBefore(el, addBtn);
            } else {
              container.appendChild(el);
            }
          }
        } else {
          if (existing) existing.remove();
        }
        if (container === fieldList) toggleGenerateButton();
      }

      function collectFields(container) {
        var fields = [];
        var rows = container.querySelectorAll(":scope > .field-row");
        rows.forEach(function (row) {
          var name = row.querySelector(".field-name").value.trim();
          if (!name) return;
          var type = row.querySelector(".field-type").value;
          var desc = row.querySelector(".field-desc").value.trim();
          var optEl = row.querySelector(".field-optional");
          var defEl = row.querySelector(".field-default");
          var f = {
            name: name,
            type: type,
            description: desc,
            optional: optEl ? optEl.checked : false,
            "default": (defEl && defEl.style.display !== "none") ? defEl.value.trim() : "",
            children: []
          };
          if (NESTED[type]) {
            var nc = row.querySelector(".nested-fields");
            if (nc) f.children = collectFields(nc);
          }
          fields.push(f);
        });
        return fields;
      }

      function escapeCode(s) {
        return s.replace(/\\/g, "\\\\").replace(/"/g, '\\"');
      }

      function renderDefault(type, d) {
        if (type === "str") return '"' + escapeCode(d) + '"';
        if (type === "bool") {
          var v = d.replace(/^\s+|\s+$/g, "").toLowerCase();
          return (v === "true" || v === "1") ? "True" : "False";
        }
        return d;
      }

      function buildSchemaCode(modelName, fields) {
        var used = { List: false, Optional: false, date: false, datetime: false, Field: false };
        function scan(flds) {
          flds.forEach(function (f) {
            var t = f.type || "str";
            if (f.description) used.Field = true;
            if (f.optional) used.Optional = true;
            if (t.indexOf("List[") === 0) used.List = true;
            if (t === "date" || t === "List[date]") used.date = true;
            if (t === "datetime" || t === "List[datetime]") used.datetime = true;
            if (NESTED[t]) scan(f.children || []);
          });
        }
        var defs = [];
        var counter = 0;
        function gen(cls, flds) {
          var lines = ["class " + cls + "(BaseModel):"];
          if (flds.length === 0) {
            lines.push("    pass");
          }
          flds.forEach(function (f) {
            var t = f.type || "str";
            var optional = !!f.optional;
            var d = f["default"] || "";
            var desc = f.description || "";
            var ann;
            if (NESTED[t]) {
              counter++;
              var nestedName = "NestedModel" + counter;
              gen(nestedName, f.children || []);
              ann = (t === "Object") ? nestedName : ("List[" + nestedName + "]");
            } else {
              ann = t;
            }
            if (optional) ann = "Optional[" + ann + "]";
            var line = "    " + f.name + ": " + ann;
            var hasDefault = d !== "";
            var rhs = null;
            if (hasDefault && desc) {
              rhs = 'Field(default=' + renderDefault(t, d) + ', description="' + escapeCode(desc) + '")';
            } else if (hasDefault) {
              rhs = renderDefault(t, d);
            } else if (optional) {
              rhs = desc ? ('Field(default=None, description="' + escapeCode(desc) + '")') : "None";
            } else if (desc) {
              rhs = 'Field(description="' + escapeCode(desc) + '")';
            }
            if (rhs !== null) line += " = " + rhs;
            lines.push(line);
          });
          defs.push(lines.join("\n"));
        }
        scan(fields);
        gen(modelName, fields);
        var imports = ["from pydantic import BaseModel" + (used.Field ? ", Field" : "")];
        var typing = [];
        if (used.List) typing.push("List");
        if (used.Optional) typing.push("Optional");
        if (typing.length) imports.push("from typing import " + typing.join(", "));
        var dt = [];
        if (used.date) dt.push("date");
        if (used.datetime) dt.push("datetime");
        if (dt.length) imports.push("from datetime import " + dt.join(", "));
        return imports.join("\n") + "\n\n" + defs.join("\n\n");
      }

      function validateBuilder(fields) {
        if (fields.length === 0) {
          return window.t("Add at least one field before extracting.");
        }
        var seen = {};
        function walk(flds) {
          for (var i = 0; i < flds.length; i++) {
            var n = flds[i].name;
            if (!FIELD_NAME_RE.test(n)) {
              return window.t('Field name "{name}" is invalid. Use letters, digits, and underscores only.', { name: n });
            }
            if (seen[n]) {
              return window.t("Duplicate field names: {names} — each name must be unique.", { names: n });
            }
            seen[n] = true;
            if (flds[i].children && flds[i].children.length) {
              var err = walk(flds[i].children);
              if (err) return err;
            }
          }
          return null;
        }
        return walk(fields);
      }

      function showBuilderError(msg) {
        builderError.textContent = msg;
        builderError.style.display = "block";
      }

      function hideBuilderError() {
        builderError.style.display = "none";
      }

      function currentModelName() {
        return modelNameInput.value.trim() || "ExtractedData";
      }

      function refreshPreview() {
        if (manualCode) return;
        textarea.value = buildSchemaCode(currentModelName(), collectFields(fieldList));
      }

      function updateAdvancedStatus() {
        var el = document.getElementById("advanced-status");
        if (!el) return;
        if (manualCode) {
          el.textContent = window.t("Manual code — your edits will be used on submit.");
          el.className = "advanced-status manual";
        } else {
          el.textContent = window.t("Code auto-generated from the builder.");
          el.className = "advanced-status auto";
        }
      }

      function switchTab(tabId) {
        var tabs = document.querySelectorAll(".tab");
        tabs.forEach(function (t) {
          t.classList.toggle("active", t.dataset.tab === tabId);
        });
        var panels = document.querySelectorAll(".tab-panel");
        panels.forEach(function (p) {
          p.classList.toggle("active", p.id === "tab-" + tabId);
        });
      }

      document.querySelectorAll(".tab").forEach(function (tab) {
        tab.addEventListener("click", function () {
          switchTab(this.dataset.tab);
        });
      });

      document.getElementById("add-field").addEventListener("click", function () {
        addField("", "str", "", false, "");
        maybeRefreshPreview();
      });

      fieldList.addEventListener("input", maybeRefreshPreview);
      fieldList.addEventListener("change", maybeRefreshPreview);
      modelNameInput.addEventListener("input", maybeRefreshPreview);

      document.getElementById("advanced-toggle").addEventListener("click", function () {
        var caret = document.getElementById("advanced-caret");
        if (advancedPanelOpen()) {
          advancedPanel.style.display = "none";
          caret.innerHTML = "&#9656;";
        } else {
          advancedPanel.style.display = "block";
          caret.innerHTML = "&#9662;";
          refreshPreview();
          updateAdvancedStatus();
        }
      });

      textarea.addEventListener("input", function () {
        manualCode = true;
        updateAdvancedStatus();
      });

      document.getElementById("code-from-builder").addEventListener("click", function () {
        manualCode = false;
        refreshPreview();
        updateAdvancedStatus();
      });

      document.getElementById("code-to-builder").addEventListener("click", function () {
        var code = textarea.value.trim();
        if (!code) return;
        fetch("/schemas/parse", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pydantic_schema: code }),
        }).then(function (r) {
          if (!r.ok) { r.json().then(function (e) { showBuilderError(window.t(e.detail) || window.t("Parse failed")); }); return; }
          return r.json();
        }).then(function (data) {
          if (!data) return;
          hideBuilderError();
          populateBuilder(data.model_name, data.fields);
          manualCode = false;
          refreshPreview();
          updateAdvancedStatus();
          switchTab("builder");
        });
      });

      function loadTemplateList() {
        fetch("/schemas")
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var sel = document.getElementById("template-select");
            sel.innerHTML = '<option value="">' + window.t('Select a saved schema...') + '</option>';
            data.forEach(function (s) {
              var opt = document.createElement("option");
              opt.value = s.id;
              opt.textContent = s.name;
              sel.appendChild(opt);
            });
          });
      }

      function getSelectedTemplateId() {
        var sel = document.getElementById("template-select");
        return sel.value || null;
      }

      function getSchemaById(id, data) {
        for (var i = 0; i < data.length; i++) {
          if (data[i].id === id) return data[i];
        }
        return null;
      }

      document.getElementById("template-save").addEventListener("click", function () {
        var fields = collectFields(fieldList);
        var err = validateBuilder(fields);
        if (err) { showBuilderError(err); return; }
        hideBuilderError();
        var code = buildSchemaCode(currentModelName(), fields);
        var name = prompt(window.t("Name for this schema:"));
        if (!name || !name.trim()) return;
        fetch("/schemas", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: name.trim(), pydantic_schema: code }),
        }).then(function (r) {
          if (!r.ok) { r.json().then(function (e) { alert(window.t(e.detail)); }); return; }
          loadTemplateList();
        });
      });

      document.getElementById("template-load").addEventListener("click", function () {
        var id = getSelectedTemplateId();
        if (!id) { alert(window.t("Select a schema first.")); return; }
        fetch("/schemas/" + id)
          .then(function (r) { return r.json(); })
          .then(function (s) {
            return fetch("/schemas/parse", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ pydantic_schema: s.pydantic_schema }),
            });
          })
          .then(function (r) {
            if (!r.ok) { r.json().then(function (e) { alert(window.t(e.detail) || window.t("Parse failed")); }); return null; }
            return r.json();
          })
          .then(function (data) {
            if (!data) return;
            populateBuilder(data.model_name, data.fields);
            manualCode = false;
            refreshPreview();
            updateAdvancedStatus();
            switchTab("builder");
          });
      });

      document.getElementById("template-delete").addEventListener("click", function () {
        var id = getSelectedTemplateId();
        if (!id) { alert(window.t("Select a schema first.")); return; }
        if (!confirm(window.t("Delete this schema?"))) return;
        fetch("/schemas/" + id, { method: "DELETE" }).then(function () {
          loadTemplateList();
        });
      });

      document.getElementById("template-export").addEventListener("click", function () {
        var id = getSelectedTemplateId();
        if (!id) { alert(window.t("Select a schema first.")); return; }
        window.open("/schemas/" + id + "/export", "_blank");
      });

      document.getElementById("template-import").addEventListener("click", function () {
        document.getElementById("template-import-input").click();
      });

      document.getElementById("template-import-input").addEventListener("change", function () {
        var file = this.files[0];
        if (!file) return;
        var formData = new FormData();
        formData.append("file", file);
        fetch("/schemas/import", { method: "POST", body: formData })
          .then(function (r) {
            if (!r.ok) { r.json().then(function (e) { alert(window.t(e.detail)); }); return; }
            loadTemplateList();
          });
        this.value = "";
      });

      function loadModels() {
        fetch("/models")
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var sel = document.getElementById("model-select");
            sel.innerHTML = '<option value="">' + window.t('Select a model...') + '</option>';
            var grouped = {};
            data.models.forEach(function (m) {
              var conn = m.connection || "";
              if (!grouped[conn]) grouped[conn] = [];
              grouped[conn].push(m);
            });
            var connOrder = Object.keys(grouped).sort(function (a, b) {
              if (a === "ollama") return -1;
              if (b === "ollama") return 1;
              return a.localeCompare(b);
            });
            connOrder.forEach(function (conn) {
              var grp = document.createElement("optgroup");
              grp.label = conn;
              grouped[conn].forEach(function (m) {
                var opt = document.createElement("option");
                opt.value = m.id;
                var caps = (m.capabilities || []).join("/");
                opt.textContent = m.model + " (" + caps + ")";
                grp.appendChild(opt);
              });
              sel.appendChild(grp);
            });
            if (data.models.length > 0) {
              var saved = sessionStorage.getItem('smd_last_model');
              var found = false;
              if (saved) {
                for (var i = 0; i < sel.options.length; i++) {
                  if (sel.options[i].value === saved) {
                    sel.value = saved;
                    found = true;
                    break;
                  }
                }
              }
              if (!found) sel.value = data.models[0].id;
            }
          });
      }

      function saveBuilderState() {
        var sel = document.getElementById('model-select');
        if (sel) sessionStorage.setItem('smd_last_model', sel.value);
        sessionStorage.setItem('smd_last_builder', JSON.stringify({ model_name: modelNameInput.value, fields: collectFields(fieldList) }));
      }

      function restoreBuilderState() {
        var saved = sessionStorage.getItem('smd_last_builder');
        if (!saved) return false;
        try {
          var data = JSON.parse(saved);
          if (!data || !data.fields) return false;
          populateBuilder(data.model_name, data.fields);
          return true;
        } catch (e) {
          return false;
        }
      }

      if (!restoreBuilderState()) {
        addField("names", "List[str]", "Full names of all people", false, "");
        addField("positions", "List[str]", "Positions in same order", false, "");
        modelNameInput.value = "OfficialsList";
      }
      updateAdvancedStatus();
      loadTemplateList();
      loadModels();

      var form = document.querySelector('form');
      var pendingConfirm = null;

      form.addEventListener('htmx:configRequest', function(evt) {
        if (evt.detail.elt !== form) return;
        var code;
        if (manualCode) {
          code = textarea.value.trim();
          if (!code) {
            evt.preventDefault();
            showBuilderError(window.t("The schema code is empty. Add fields in the builder or write code in the Advanced panel."));
            return;
          }
        } else {
          var fields = collectFields(fieldList);
          var err = validateBuilder(fields);
          if (err) {
            evt.preventDefault();
            showBuilderError(err);
            return;
          }
          code = buildSchemaCode(currentModelName(), fields);
        }
        hideBuilderError();
        textarea.value = code;
        if (evt.detail.parameters) {
          evt.detail.parameters.pydantic_schema = code;
        }
        if (pendingConfirm && !confirm(pendingConfirm)) {
          evt.preventDefault();
        }
      });

      form.addEventListener('htmx:beforeRequest', function() {
        saveBuilderState();
      });

      var fileInput = document.querySelector('input[type="file"][name="file"]');
      if (fileInput) {
        fileInput.addEventListener('change', function() {
          if (this.files && this.files.length > 0) {
            var sizes = [];
            for (var i = 0; i < this.files.length; i++) sizes.push(this.files[i].size);
            var model = document.getElementById('model-select');
            fetch('/api/batches/estimate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ file_sizes: sizes, model_id: model ? model.value : '' }),
            }).then(function(r) { return r.json(); }).then(function(data) {
              if (data.estimated_cost !== undefined && data.estimated_cost > 0) {
                var noun = data.documents === 1 ? window.t('document') : window.t('documents');
                pendingConfirm = window.t('Estimated cost ${cost} for {count} {noun} with {model}. Continue?', {cost: data.estimated_cost.toFixed(6), count: data.documents, noun: noun, model: data.model});
              }
            });
          } else {
            pendingConfirm = null;
          }
        });
      }
    })();
  </script>
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'light';
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      var btn = document.getElementById('theme-btn');
      if (btn) {
        btn.textContent = theme === 'dark' ? '\u2600\uFE0F' : '\uD83C\uDF19';
        btn.addEventListener('click', function() {
          var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          btn.textContent = next === 'dark' ? '\u2600\uFE0F' : '\uD83C\uDF19';
        });
      }
    })();
  </script>
  <script>
    fetch('/auth/me').then(function(r) { return r.json(); }).then(function(u) {
      if (u.role === 'admin') {
        document.getElementById('admin-link').style.display = 'inline';
        document.getElementById('usage-link').href = '/admin/usage';
      }
    });
  </script>
</body>
</html>
