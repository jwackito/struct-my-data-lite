{% extends "base.html" %}
{% block title %}<title data-i18n="Failures — Admin — Struct My Data">Failures — Admin — Struct My Data</title>{% endblock %}
{% block head %}
  <style>
    body { max-width: 960px; }
    .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .filters input, .filters select { padding: 0.4rem 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.8rem; }
    .filters input[type="text"] { min-width: 160px; }
    .filters button { padding: 0.4rem 0.9rem; border: none; border-radius: 4px; background: #2563eb; color: #fff; font-size: 0.8rem; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; font-size: 0.8rem; }
    th, td { border: 1px solid #ddd; padding: 0.45rem; text-align: left; vertical-align: top; }
    th { background: #f5f5f5; font-weight: 600; }
    td.err { color: #b91c1c; max-width: 320px; }
    .badge { font-size: 0.7rem; padding: 0.1rem 0.35rem; border-radius: 4px; background: #fee2e2; color: #991b1b; }
    a.detail { color: #2563eb; text-decoration: none; }
    .pagination { margin-top: 0.75rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    .pagination button { padding: 0.3rem 0.6rem; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; }
    .pagination button:disabled { opacity: 0.4; cursor: default; }
    [data-theme="dark"] .filters input, [data-theme="dark"] .filters select { background: #2d2d2d; color: #e5e5e5; border-color: #555; }
    [data-theme="dark"] th, [data-theme="dark"] td { border-color: #404040; }
    [data-theme="dark"] th { background: #2d2d2d; }
    [data-theme="dark"] td.err { color: #fca5a5; }
    [data-theme="dark"] .pagination button { background: #2d2d2d; border-color: #555; color: #e5e5e5; }
  </style>
{% endblock %}
{% block content %}
  <h1 data-i18n="Failed jobs">Failed jobs</h1>
  <div class="filters">
    <input type="text" id="f-user" placeholder="User email or name" data-i18n-ph="User email or name">
    <input type="text" id="f-model" placeholder="Model" data-i18n-ph="Model">
    <input type="text" id="f-connection" placeholder="Connection" data-i18n-ph="Connection">
    <input type="text" id="f-content-type" placeholder="Content type" data-i18n-ph="Content type">
    <input type="date" id="f-since" title="Since">
    <input type="date" id="f-until" title="Until">
    <button onclick="applyFilters()" data-i18n="Filter">Filter</button>
  </div>
  <div id="failures-table"><p data-i18n="Loading...">Loading...</p></div>
  <div id="pagination" class="pagination" style="display:none">
    <button id="prev-btn" onclick="prevPage()">&larr; <span data-i18n="Prev">Prev</span></button>
    <span id="page-info"></span>
    <button id="next-btn" onclick="nextPage()"><span data-i18n="Next">Next</span> &rarr;</button>
  </div>
{% endblock %}
{% block scripts %}
  <script>
    var currentOffset = 0;
    var pageSize = 20;
    var currentTotal = 0;

    function currentFilters() {
      var params = new URLSearchParams();
      var fields = [['user', 'f-user'], ['model', 'f-model'], ['connection', 'f-connection'], ['content_type', 'f-content-type'], ['since', 'f-since'], ['until', 'f-until']];
      fields.forEach(function (pair) {
        var val = document.getElementById(pair[1]).value.trim();
        if (val) params.set(pair[0], val);
      });
      return params;
    }

    function loadFailures() {
      var params = currentFilters();
      params.set('offset', currentOffset);
      params.set('limit', pageSize);
      fetch('/admin/failures/data?' + params.toString())
        .then(function (r) { return r.json(); })
        .then(function (data) {
          currentTotal = data.total;
          renderTable(data.jobs);
          renderPagination();
        });
    }

    function renderTable(jobs) {
      var el = document.getElementById('failures-table');
      if (!jobs.length) {
        el.innerHTML = '<p data-i18n="No failed jobs">' + window.t('No failed jobs') + '</p>';
        return;
      }
      var html = '<table><thead><tr>'
        + '<th data-i18n="Time">' + window.t('Time') + '</th>'
        + '<th data-i18n="User">' + window.t('User') + '</th>'
        + '<th data-i18n="Document">' + window.t('Document') + '</th>'
        + '<th data-i18n="Type">' + window.t('Type') + '</th>'
        + '<th data-i18n="Model">' + window.t('Model') + '</th>'
        + '<th data-i18n="Connection">' + window.t('Connection') + '</th>'
        + '<th data-i18n="Error">' + window.t('Error') + '</th>'
        + '</tr></thead><tbody>';
      jobs.forEach(function (j) {
        html += '<tr>'
          + '<td>' + (j.created_at || '') + '</td>'
          + '<td>' + (j.user_email || '—') + '</td>'
          + '<td><a class="detail" href="/admin/jobs/' + j.id + '">' + (j.filename || '—') + '</a></td>'
          + '<td>' + (j.content_type || '—') + '</td>'
          + '<td>' + (j.model_name || '—') + '</td>'
          + '<td>' + (j.connection_name || '—') + '</td>'
          + '<td class="err">' + (j.error_message || '') + '</td>'
          + '</tr>';
      });
      html += '</tbody></table>';
      el.innerHTML = html;
    }

    function renderPagination() {
      var el = document.getElementById('pagination');
      el.style.display = currentTotal > pageSize ? 'flex' : 'none';
      document.getElementById('prev-btn').disabled = currentOffset === 0;
      document.getElementById('next-btn').disabled = currentOffset + pageSize >= currentTotal;
      var from = currentTotal ? currentOffset + 1 : 0;
      var to = Math.min(currentOffset + pageSize, currentTotal);
      document.getElementById('page-info').textContent = from + '–' + to + ' / ' + currentTotal;
    }

    function applyFilters() { currentOffset = 0; loadFailures(); }
    function prevPage() { currentOffset = Math.max(0, currentOffset - pageSize); loadFailures(); }
    function nextPage() { currentOffset += pageSize; loadFailures(); }

    document.addEventListener('DOMContentLoaded', loadFailures);
  </script>
{% endblock %}
