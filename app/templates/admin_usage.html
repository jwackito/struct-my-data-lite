<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="Usage — Admin — Struct My Data">Usage — Admin — Struct My Data</title>
  <script src="/i18n.js"></script>
  <style>
    body { max-width: 860px; margin: 2rem auto; padding: 0 1rem; font-family: system-ui, -apple-system, sans-serif; line-height: 1.5; color: #1a1a1a; }
    h1 { font-size: 1.5rem; }
    .nav { margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .nav a { color: #2563eb; text-decoration: none; font-size: 0.9rem; }
    .nav a:hover { text-decoration: underline; }
    .theme-btn { background: none; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; padding: 0.25rem 0.5rem; font-size: 1rem; line-height: 1; }
    .controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; align-items: center; flex-wrap: wrap; }
    .controls select { padding: 0.4rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
    .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.75rem; background: #fafafa; }
    .card h3 { margin: 0 0 0.25rem; font-size: 0.8rem; color: #6b7280; }
    .card .value { font-size: 1.5rem; font-weight: 700; }
    table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
    th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; }
    th { background: #f5f5f5; font-weight: 600; }
    [data-theme="dark"] body { background: #1a1a1a; color: #e5e5e5; }
    [data-theme="dark"] .nav a { color: #60a5fa; }
    [data-theme="dark"] .theme-btn { border-color: #555; }
    [data-theme="dark"] .controls select { background: #2d2d2d; color: #e5e5e5; border-color: #555; }
    [data-theme="dark"] .card { background: #2d2d2d; border-color: #404040; }
    [data-theme="dark"] .card h3 { color: #9ca3af; }
    [data-theme="dark"] th, [data-theme="dark"] td { border-color: #404040; }
    [data-theme="dark"] th { background: #2d2d2d; }
  </style>
</head>
<body>
  <div class="nav">
    <div style="display:flex;gap:1rem;align-items:center">
      <a href="/">&larr; <span data-i18n="Extraction">Extraction</span></a>
      <a href="/admin/users" data-i18n="Users">Users</a>
      <a href="/admin/usage" style="font-weight:600" data-i18n="Usage">Usage</a>
      <a href="/admin/schemas" data-i18n="Schemas">Schemas</a>
    </div>
    <div style="display:flex;gap:0.5rem;align-items:center">
      <div id="lang-switcher"></div>
      <button id="theme-btn" class="theme-btn" title="Toggle theme" data-i18n-title="Toggle theme">&#x1F319;</button>
      <a href="#" onclick="fetch('/auth/logout',{method:'POST'}).then(function(){window.location.href='/login'});return false" style="font-size:0.85rem;text-decoration:none" data-i18n="Logout">Logout</a>
    </div>
  </div>
  <h1 data-i18n="System Usage">System Usage</h1>
  <div class="controls">
    <select id="range" onchange="loadUsage()">
      <option value="7" data-i18n="Last 7 days">Last 7 days</option>
      <option value="30" selected data-i18n="Last 30 days">Last 30 days</option>
      <option value="90" data-i18n="Last 90 days">Last 90 days</option>
      <option value="all" data-i18n="All time">All time</option>
    </select>
  </div>
  <div class="cards">
    <div class="card"><h3 data-i18n="Users">Users</h3><div class="value" id="stat-users">-</div></div>
    <div class="card"><h3 data-i18n="Jobs">Jobs</h3><div class="value" id="stat-jobs">-</div></div>
    <div class="card"><h3 data-i18n="Input Tokens">Input Tokens</h3><div class="value" id="stat-input">-</div></div>
    <div class="card"><h3 data-i18n="Output Tokens">Output Tokens</h3><div class="value" id="stat-output">-</div></div>
    <div class="card"><h3 data-i18n="Cost (USD)">Cost (USD)</h3><div class="value" id="stat-cost">$0.00</div></div>
  </div>
  <div id="breakdown"></div>
  <script>
    function loadUsage() {
      var range = document.getElementById('range').value;
      var url = '/admin/usage/data';
      if (range !== 'all') {
        var d = new Date();
        d.setDate(d.getDate() - parseInt(range));
        url += '?from_date=' + d.toISOString().slice(0,10);
      }
      fetch(url).then(function(r) { return r.json(); }).then(function(data) {
        document.getElementById('stat-users').textContent = data.total_users || 0;
        document.getElementById('stat-jobs').textContent = data.total_jobs || 0;
        document.getElementById('stat-input').textContent = (data.total_input_tokens || 0).toLocaleString();
        document.getElementById('stat-output').textContent = (data.total_output_tokens || 0).toLocaleString();
        document.getElementById('stat-cost').textContent = '$' + (data.total_cost || 0).toFixed(6);

        var el = document.getElementById('breakdown');
        if (data.per_user && data.per_user.length > 0) {
          var html = '<h2 style="font-size:1.1rem;margin:1rem 0 0.5rem">' + window.t('Per User') + '</h2>';
          html += '<table><thead><tr><th>' + window.t('Email') + '</th><th>' + window.t('Jobs') + '</th><th>' + window.t('Input Tokens') + '</th><th>' + window.t('Output Tokens') + '</th><th>' + window.t('Cost') + '</th></tr></thead><tbody>';
          data.per_user.forEach(function(u) {
            html += '<tr>'
              + '<td>' + (u.email || u.user_id || 'unknown') + '</td>'
              + '<td>' + (u.jobs || 0) + '</td>'
              + '<td>' + (u.input_tokens || 0).toLocaleString() + '</td>'
              + '<td>' + (u.output_tokens || 0).toLocaleString() + '</td>'
              + '<td>$' + (u.cost || 0).toFixed(6) + '</td>'
              + '</tr>';
          });
          html += '</tbody></table>';
          el.innerHTML = html;
        } else {
          el.innerHTML = '';
        }
      });
    }
    loadUsage();
  </script>
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'light';
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      var btn = document.getElementById('theme-btn');
      if (btn) {
        btn.textContent = theme === 'dark' ? '\u2600\uFE0F' : '\uD83C\uDF19';
        btn.addEventListener('click', function() {
          var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          btn.textContent = next === 'dark' ? '\u2600\uFE0F' : '\uD83C\uDF19';
        });
      }
    })();
  </script>
</body>
</html>
