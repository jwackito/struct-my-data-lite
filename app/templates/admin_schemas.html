{% extends "base.html" %}
{% block title %}<title data-i18n="Schemas — Admin — Struct My Data">Schemas — Admin — Struct My Data</title>{% endblock %}
{% block head %}
  <style>
    body { max-width: 1100px; }
    table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
    th, td { border: 1px solid #ddd; padding: 0.45rem; text-align: left; vertical-align: middle; }
    th { background: #f5f5f5; font-weight: 600; }
    .badge { font-size: 0.72rem; padding: 0.12rem 0.4rem; border-radius: 4px; white-space: nowrap; }
    .badge.on { background: #d1fae5; color: #065f46; }
    .badge.off { background: #fee2e2; color: #991b1b; }
    .action-btn { font-size: 0.75rem; padding: 0.25rem 0.5rem; border: none; border-radius: 4px; cursor: pointer; margin: 0.05rem; }
    .action-btn.pub { background: #2563eb; color: #fff; }
    .action-btn.unpub { background: #f59e0b; color: #fff; }
    .action-btn.del { background: #dc2626; color: #fff; }
    .action-btn:hover { opacity: 0.85; }
    .msg { font-size: 0.85rem; margin-top: 0.5rem; padding: 0.35rem 0.6rem; border-radius: 4px; display: none; }
    .msg.err { display: block; background: #fee2e2; color: #991b1b; }
    .msg.ok { display: block; background: #d1fae5; color: #065f46; }
    [data-theme="dark"] th, [data-theme="dark"] td { border-color: #404040; }
    [data-theme="dark"] th { background: #2d2d2d; }
    [data-theme="dark"] .badge.on { background: #064e3b; color: #6ee7b7; }
    [data-theme="dark"] .badge.off { background: #7f1d1d; color: #fca5a5; }
    [data-theme="dark"] .msg.err { background: #7f1d1d; color: #fca5a5; }
    [data-theme="dark"] .msg.ok { background: #064e3b; color: #6ee7b7; }
  </style>
{% endblock %}
{% block content %}
  <h1 data-i18n="Schemas">Schemas</h1>
  <div id="schemas-table"><p data-i18n="Loading...">Loading...</p></div>
  <div id="msg" class="msg"></div>
{% endblock %}
{% block scripts %}
  <script>
    function loadSchemas() {
      var el = document.getElementById('schemas-table');
      el.innerHTML = '<p>' + window.t('Loading...') + '</p>';
      fetch('/admin/schemas/data').then(function(r) { return r.json(); }).then(function(data) {
        if (!data.schemas.length) {
          el.innerHTML = '<p style="color:#9ca3af">' + window.t('No schemas found.') + '</p>';
          return;
        }
        var html = '<table><thead><tr>'
          + '<th>' + window.t('Schema') + '</th>'
          + '<th>' + window.t('Owner') + '</th>'
          + '<th>' + window.t('Visibility') + '</th>'
          + '<th>' + window.t('Updated') + '</th>'
          + '<th>' + window.t('Actions') + '</th>'
          + '</tr></thead><tbody>';
        data.schemas.forEach(function(s) {
          var badge = s.is_public
            ? '<span class="badge on">' + window.t('public') + '</span>'
            : '<span class="badge off">' + window.t('private') + '</span>';
          var toggle = s.is_public
            ? '<button class="action-btn unpub" onclick="publish(\'' + s.id + '\', false)">' + window.t('Unpublish') + '</button>'
            : '<button class="action-btn pub" onclick="publish(\'' + s.id + '\', true)">' + window.t('Publish') + '</button>';
          html += '<tr>'
            + '<td style="font-family:monospace">' + s.name + '</td>'
            + '<td>' + s.owner_name + '</td>'
            + '<td>' + badge + '</td>'
            + '<td>' + (s.updated_at || '') + '</td>'
            + '<td>' + toggle + ' '
            + '<button class="action-btn del" onclick="removeSchema(\'' + s.id + '\')">' + window.t('Delete') + '</button>'
            + '</td></tr>';
        });
        html += '</tbody></table>';
        el.innerHTML = html;
      });
    }

    function publish(id, value) {
      fetch('/schemas/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ is_public: value }),
      }).then(function(r) {
        if (r.ok) { showMsg('', true); loadSchemas(); }
        else r.json().then(function(e) { showMsg(window.t(e.detail) || window.t('Failed')); });
      });
    }

    function removeSchema(id) {
      if (!confirm(window.t('Delete this schema?'))) return;
      fetch('/schemas/' + id, { method: 'DELETE' }).then(function(r) {
        if (r.ok) { showMsg('', true); loadSchemas(); }
        else showMsg(window.t('Failed'));
      });
    }

    function showMsg(text, ok) {
      var el = document.getElementById('msg');
      el.className = ok ? 'msg ok' : 'msg err';
      el.textContent = ok ? (window.t('Done') || 'OK') : text;
      if (ok) setTimeout(function() { el.className = 'msg'; }, 2000);
    }

    loadSchemas();
  </script>
{% endblock %}
