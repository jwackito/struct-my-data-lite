{% extends "base.html" %}
{% block title %}<title data-i18n="Admin — Struct My Data">Admin — Struct My Data</title>{% endblock %}
{% block head %}
  <style>
    body { max-width: 720px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; background: #fafafa; }
    .card h3 { margin: 0 0 0.25rem; font-size: 0.85rem; color: #6b7280; }
    .card .value { font-size: 1.8rem; font-weight: 700; color: #1a1a1a; }
    .actions { display: flex; flex-direction: column; gap: 0.5rem; }
    .actions a { display: block; padding: 0.6rem 1.2rem; background: #2563eb; color: #fff; border-radius: 4px; text-decoration: none; text-align: center; }
    .actions a:hover { background: #1d4ed8; }
    [data-theme="dark"] .card { background: #2d2d2d; border-color: #404040; }
    [data-theme="dark"] .card .value { color: #e5e5e5; }
    [data-theme="dark"] .card h3 { color: #9ca3af; }
    [data-theme="dark"] .actions a:hover { background: #3b82f6; }
  </style>
{% endblock %}
{% block content %}
  <h1 data-i18n="Admin">Admin</h1>
  <div class="cards" id="summary">
    <div class="card"><h3 data-i18n="Users">Users</h3><div class="value" id="total-users">-</div></div>
    <div class="card"><h3 data-i18n="Active">Active</h3><div class="value" id="active-users">-</div></div>
    <div class="card"><h3 data-i18n="Total Jobs">Total Jobs</h3><div class="value" id="total-jobs">-</div></div>
  </div>
  <div class="actions">
    <a href="/admin/users" data-i18n="Manage Users">Manage Users</a>
    <a href="/admin/models" data-i18n="Manage Models">Manage Models</a>
    <a href="/admin/schemas" data-i18n="Manage Schemas">Manage Schemas</a>
  </div>
{% endblock %}
{% block scripts %}
  <script>
    fetch('/admin/users/data?limit=1').then(function(r) { return r.json(); }).then(function(data) {
      document.getElementById('total-users').textContent = data.total;
    });
    fetch('/admin/users/data?limit=1&search=').then(function(r) { return r.json(); }).then(function(data) {
      document.getElementById('active-users').textContent = data.users.filter(function(u) { return u.is_active; }).length;
    });
    document.getElementById('total-jobs').textContent = '\u2026';
  </script>
{% endblock %}
