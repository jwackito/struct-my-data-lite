<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="Users — Admin — Struct My Data">Users — Admin — Struct My Data</title>
  <script src="/i18n.js"></script>
  <style>
    body { max-width: 860px; margin: 2rem auto; padding: 0 1rem; font-family: system-ui, -apple-system, sans-serif; line-height: 1.5; color: #1a1a1a; }
    h1 { font-size: 1.5rem; }
    .nav { margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .nav a { color: #2563eb; text-decoration: none; font-size: 0.9rem; }
    .nav a:hover { text-decoration: underline; }
    .theme-btn { background: none; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; padding: 0.25rem 0.5rem; font-size: 1rem; line-height: 1; }
    #search { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.875rem; margin-bottom: 1rem; box-sizing: border-box; }
    table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
    th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; }
    th { background: #f5f5f5; font-weight: 600; }
    .badge { font-size: 0.75rem; padding: 0.15rem 0.4rem; border-radius: 4px; }
    .badge.admin { background: #dbeafe; color: #1e40af; }
    .badge.user { background: #e5e7eb; color: #374151; }
    .badge.active { background: #d1fae5; color: #065f46; }
    .badge.disabled { background: #fee2e2; color: #991b1b; }
    .action-btn { font-size: 0.8rem; padding: 0.25rem 0.5rem; border: none; border-radius: 4px; cursor: pointer; margin: 0.1rem; }
    .action-btn.toggle { background: #f59e0b; color: #fff; }
    .action-btn.promote { background: #8b5cf6; color: #fff; }
    .action-btn.demote { background: #6b7280; color: #fff; }
    .action-btn.delete { background: #dc2626; color: #fff; }
    .action-btn.models { background: #0ea5e9; color: #fff; }
    .action-btn:hover { opacity: 0.85; }
    .pagination { margin-top: 0.75rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    .pagination button { padding: 0.3rem 0.6rem; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; }
    .pagination button:disabled { opacity: 0.4; cursor: default; }
    .create-row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; }
    .create-btn { padding: 0.5rem 1rem; border: none; border-radius: 4px; font-size: 0.85rem; cursor: pointer; background: #2563eb; color: #fff; }
    .create-btn:hover { background: #1d4ed8; }
    #create-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); align-items: center; justify-content: center; }
    #create-modal.open { display: flex; }
    #models-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); align-items: center; justify-content: center; }
    #models-modal.open { display: flex; }
    .modal-box { background: #fff; border-radius: 8px; padding: 1.5rem; max-width: 420px; width: 90%; }
    .modal-box h3 { margin: 0 0 0.75rem 0; }
    .modal-box label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.6rem; }
    .modal-box input, .modal-box select { padding: 0.4rem 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; }
    .modal-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .modal-actions button { padding: 0.5rem 0.9rem; border: none; border-radius: 4px; font-size: 0.85rem; cursor: pointer; }
    .msg { font-size: 0.8rem; margin-top: 0.5rem; padding: 0.3rem 0.5rem; border-radius: 4px; display: none; }
    .msg.err { display: block; background: #fee2e2; color: #991b1b; }
    .msg.ok { display: block; background: #d1fae5; color: #065f46; }
    [data-theme="dark"] body { background: #1a1a1a; color: #e5e5e5; }
    [data-theme="dark"] .nav a { color: #60a5fa; }
    [data-theme="dark"] .theme-btn { border-color: #555; }
    [data-theme="dark"] #search { background: #2d2d2d; color: #e5e5e5; border-color: #555; }
    [data-theme="dark"] th, [data-theme="dark"] td { border-color: #404040; }
    [data-theme="dark"] th { background: #2d2d2d; }
    [data-theme="dark"] .badge.user { background: #404040; color: #9ca3af; }
    [data-theme="dark"] .badge.admin { background: #1e3a5f; color: #93c5fd; }
    [data-theme="dark"] .badge.active { background: #064e3b; color: #6ee7b7; }
    [data-theme="dark"] .badge.disabled { background: #7f1d1d; color: #fca5a5; }
    [data-theme="dark"] .pagination button { background: #2d2d2d; border-color: #555; color: #e5e5e5; }
    [data-theme="dark"] .create-btn:hover { background: #3b82f6; }
    [data-theme="dark"] .modal-box { background: #2d2d2d; }
    [data-theme="dark"] .modal-box input, [data-theme="dark"] .modal-box select { background: #2d2d2d; color: #e5e5e5; border-color: #555; }
    [data-theme="dark"] .msg.err { background: #7f1d1d; color: #fca5a5; }
    [data-theme="dark"] .msg.ok { background: #064e3b; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="nav">
    <div style="display:flex;gap:1rem;align-items:center">
      <a href="/">&larr; <span data-i18n="Extraction">Extraction</span></a>
      <a href="/admin/usage" data-i18n="Usage">Usage</a>
      <a href="/admin" data-i18n="Admin">Admin</a>
      <a href="/admin/users" style="font-weight:600" data-i18n="Users">Users</a>
      <a href="/admin/schemas" data-i18n="Schemas">Schemas</a>
    </div>
    <div style="display:flex;gap:0.5rem;align-items:center">
      <div id="lang-switcher"></div>
      <button id="theme-btn" class="theme-btn" title="Toggle theme" data-i18n-title="Toggle theme">&#x1F319;</button>
      <a href="#" onclick="fetch('/auth/logout',{method:'POST'}).then(function(){window.location.href='/login'});return false" style="font-size:0.85rem;text-decoration:none" data-i18n="Logout">Logout</a>
    </div>
  </div>
  <h1 data-i18n="Users">Users</h1>
  <div class="create-row">
    <input type="text" id="search" placeholder="Search by email or name..." data-i18n-ph="Search by email or name..." onkeyup="var v=this.value;clearTimeout(t);t=setTimeout(function(){loadUsers(v)},300)" style="flex:1;margin-bottom:0">
    <button class="create-btn" onclick="openCreateModal()" data-i18n="Create User">Create User</button>
  </div>
  <div id="users-table"><p data-i18n="Loading...">Loading...</p></div>

  <div id="create-modal">
    <div class="modal-box">
      <h3 data-i18n="Create User">Create User</h3>
      <label><span data-i18n="Email">Email</span> <input type="email" id="new-user-email"></label>
      <label><span data-i18n="Display Name">Display Name</span> <input type="text" id="new-user-name"></label>
      <label><span data-i18n="Password">Password</span> <input type="password" id="new-user-password"></label>
      <label><span data-i18n="Role">Role</span>
        <select id="new-user-role">
          <option value="user" data-i18n="user">user</option>
          <option value="admin" data-i18n="admin">admin</option>
        </select>
      </label>
      <div class="modal-actions">
        <button class="create-btn" onclick="createUser()" data-i18n="Create">Create</button>
        <button class="action-btn demote" onclick="closeCreateModal()" data-i18n="Cancel">Cancel</button>
      </div>
      <div id="create-msg" class="msg"></div>
    </div>
  </div>
  <div id="models-modal">
    <div class="modal-box" style="max-width:640px;max-height:80vh;display:flex;flex-direction:column">
      <h3 data-i18n="Model access">Model access</h3>
      <div id="models-list" style="overflow-y:auto;flex:1"></div>
      <div class="modal-actions">
        <button class="create-btn" onclick="saveModelsModal()" data-i18n="Save">Save</button>
        <button class="action-btn demote" onclick="closeModelsModal()" data-i18n="Cancel">Cancel</button>
      </div>
    </div>
  </div>
  <script>
    var t;
    var currentSearch = '';
    var currentOffset = 0;
    var pageSize = 20;
    var modelSelections = {};
    var modelModalUserId = null;

    function openModelsModal(userId) {
      modelModalUserId = userId;
      modelSelections = {};
      var el = document.getElementById('models-list');
      el.innerHTML = '<p>' + window.t('Loading...') + '</p>';
      document.getElementById('models-modal').classList.add('open');
      Promise.all([
        fetch('/admin/models/data?include_hidden=1').then(function(r) { return r.json(); }),
        fetch('/admin/users/' + userId + '/models').then(function(r) { return r.json(); }),
      ]).then(function(results) {
        var models = results[0].models;
        var grants = {};
        results[1].grants.forEach(function(g) { grants[g.model_id] = g.access; });
        var html = '';
        models.forEach(function(m) {
          var val = grants[m.id] || 'default';
          modelSelections[m.id] = val;
          html += '<div style="display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0;border-bottom:1px solid #eee">'
            + '<span style="font-family:monospace;font-size:0.8rem;flex:1">' + m.model_name + '</span>'
            + '<span style="font-size:0.75rem;color:#6b7280">' + m.connection + '</span>'
            + '<select onchange="modelSelections[\'' + m.id + '\']=this.value">'
            + '<option value="default"' + (val === 'default' ? ' selected' : '') + '>' + window.t('Default') + '</option>'
            + '<option value="allow"' + (val === 'allow' ? ' selected' : '') + '>' + window.t('Allow') + '</option>'
            + '<option value="deny"' + (val === 'deny' ? ' selected' : '') + '>' + window.t('Deny') + '</option>'
            + '</select></div>';
        });
        el.innerHTML = html || '<p>' + window.t('No models found.') + '</p>';
      });
    }

    function closeModelsModal() {
      document.getElementById('models-modal').classList.remove('open');
    }

    function saveModelsModal() {
      var grants = [];
      for (var id in modelSelections) {
        grants.push({ model_id: id, access: modelSelections[id] });
      }
      fetch('/admin/users/' + modelModalUserId + '/models', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ grants: grants }),
      }).then(function(r) {
        if (r.ok) closeModelsModal();
        else r.json().then(function(e) { alert(window.t(e.detail) || window.t('Failed')); });
      });
    }

    function loadUsers(search, offset) {
      currentSearch = (search !== undefined) ? search : currentSearch;
      currentOffset = (offset !== undefined) ? offset : currentOffset;
      document.getElementById('users-table').innerHTML = '<p>' + window.t('Loading...') + '</p>';

      var url = '/admin/users/data?offset=' + currentOffset + '&limit=' + pageSize;
      if (currentSearch) url += '&search=' + encodeURIComponent(currentSearch);

      fetch(url).then(function(r) { return r.json(); }).then(function(data) {
        var html = '<table><thead><tr><th>' + window.t('Email') + '</th><th>' + window.t('Name') + '</th><th>' + window.t('Role') + '</th><th>' + window.t('Status') + '</th><th>' + window.t('Jobs') + '</th><th>' + window.t('Registered') + '</th><th>' + window.t('Actions') + '</th></tr></thead><tbody>';
        data.users.forEach(function(u) {
          var roleBadge = '<span class="badge ' + u.role + '">' + window.t(u.role) + '</span>';
          var statusBadge = u.is_active ? '<span class="badge active">' + window.t('active') + '</span>' : '<span class="badge disabled">' + window.t('disabled') + '</span>';
          var toggleLabel = u.is_active ? window.t('Disable') : window.t('Enable');
          var roleAction = u.role === 'admin'
            ? '<button class="action-btn demote" onclick="setRole(\'' + u.id + '\', \'user\')">' + window.t('Demote') + '</button>'
            : '<button class="action-btn promote" onclick="setRole(\'' + u.id + '\', \'admin\')">' + window.t('Promote') + '</button>';
          var date = u.created_at ? u.created_at.slice(0, 10) : '-';
          html += '<tr>'
            + '<td>' + u.email + '</td>'
            + '<td>' + (u.display_name || '-') + '</td>'
            + '<td>' + roleBadge + '</td>'
            + '<td>' + statusBadge + '</td>'
            + '<td>' + (u.job_count || 0) + '</td>'
            + '<td>' + date + '</td>'
            + '<td>'
            + '<button class="action-btn toggle" onclick="toggleStatus(\'' + u.id + '\', ' + !u.is_active + ')">' + toggleLabel + '</button> '
            + roleAction + ' '
            + '<button class="action-btn models" onclick="openModelsModal(\'' + u.id + '\')">' + window.t('Models') + '</button> '
            + '<button class="action-btn delete" onclick="deleteUser(\'' + u.id + '\')">' + window.t('Delete') + '</button>'
            + '</td></tr>';
        });
        html += '</tbody></table>';

        var totalPages = Math.max(1, Math.ceil(data.total / pageSize));
        var page = Math.floor(currentOffset / pageSize) + 1;
        var prevDisabled = currentOffset === 0 ? 'disabled' : '';
        var nextDisabled = (currentOffset + pageSize) >= data.total ? 'disabled' : '';
        html += '<div class="pagination">'
          + '<button ' + prevDisabled + ' onclick="loadUsers(currentSearch, ' + Math.max(0, currentOffset - pageSize) + ')">&larr; ' + window.t('Prev') + '</button>'
          + '<span>' + window.t('Page {page} of {total} ({count} users)', {page: page, total: totalPages, count: data.total}) + '</span>'
          + '<button ' + nextDisabled + ' onclick="loadUsers(currentSearch, ' + (currentOffset + pageSize) + ')">' + window.t('Next') + ' &rarr;</button>'
          + '</div>';

        document.getElementById('users-table').innerHTML = html;
      });
    }

    function toggleStatus(id, isActive) {
      fetch('/admin/users/' + id + '/toggle-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ is_active: isActive }),
      }).then(function(r) {
        if (r.ok) loadUsers();
        else r.json().then(function(e) { alert(window.t(e.detail) || window.t('Failed')); });
      });
    }

    function openCreateModal() {
      document.getElementById('create-modal').classList.add('open');
      document.getElementById('new-user-email').value = '';
      document.getElementById('new-user-name').value = '';
      document.getElementById('new-user-password').value = '';
      document.getElementById('new-user-role').value = 'user';
      document.getElementById('create-msg').className = 'msg';
      document.getElementById('new-user-email').focus();
    }

    function closeCreateModal() {
      document.getElementById('create-modal').classList.remove('open');
    }

    function createUser() {
      var msg = document.getElementById('create-msg');
      msg.className = 'msg';
      var body = {
        email: document.getElementById('new-user-email').value.trim(),
        password: document.getElementById('new-user-password').value,
        display_name: document.getElementById('new-user-name').value.trim(),
        role: document.getElementById('new-user-role').value,
      };
      fetch('/admin/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      }).then(function(r) {
        return r.json().then(function(d) { return { ok: r.ok, data: d }; });
      }).then(function(res) {
        if (res.ok) {
          closeCreateModal();
          loadUsers();
        } else {
          msg.className = 'msg err';
          msg.textContent = window.t(res.data.detail) || window.t('Failed');
        }
      }).catch(function() {
        msg.className = 'msg err';
        msg.textContent = window.t('Failed');
      });
    }

    function setRole(id, role) {
      if (!confirm(window.t('Change role to {role}?', {role: role}))) return;
      fetch('/admin/users/' + id + '/set-role', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role: role }),
      }).then(function(r) {
        if (r.ok) loadUsers();
        else r.json().then(function(e) { alert(window.t(e.detail) || window.t('Failed')); });
      });
    }

    function deleteUser(id) {
      if (!confirm(window.t('Delete this user? This will disable their account.'))) return;
      fetch('/admin/users/' + id, { method: 'DELETE' }).then(function(r) {
        if (r.ok) loadUsers();
        else r.json().then(function(e) { alert(window.t(e.detail) || window.t('Failed')); });
      });
    }

    loadUsers('', 0);
  </script>
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'light';
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      var btn = document.getElementById('theme-btn');
      if (btn) {
        btn.textContent = theme === 'dark' ? '\u2600\uFE0F' : '\uD83C\uDF19';
        btn.addEventListener('click', function() {
          var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          btn.textContent = next === 'dark' ? '\u2600\uFE0F' : '\uD83C\uDF19';
        });
      }
    })();
  </script>
</body>
</html>
