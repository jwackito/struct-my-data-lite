{% extends "base.html" %}
{% block title %}<title data-i18n="Batch — Struct My Data">Batch — Struct My Data</title>{% endblock %}
{% block head %}
  <style>
    body { max-width: 860px; }
    .progress { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
    .progress-bar { flex: 1; height: 10px; background: #e5e7eb; border-radius: 5px; overflow: hidden; }
    .progress-fill { height: 100%; background: #2563eb; border-radius: 5px; transition: width 0.5s; }
    .progress-text { font-size: 0.85rem; color: #6b7280; white-space: nowrap; }
    .badge { font-size: 0.75rem; padding: 0.15rem 0.4rem; border-radius: 4px; }
    .badge.completed { background: #d1fae5; color: #065f46; }
    .badge.failed { background: #fee2e2; color: #991b1b; }
    .badge.running { background: #dbeafe; color: #1e40af; }
    .badge.pending { background: #e5e7eb; color: #374151; }
    .actions { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .btn { padding: 0.5rem 0.9rem; border: none; border-radius: 4px; font-size: 0.85rem; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-secondary { background: #6b7280; color: #fff; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-success { background: #059669; color: #fff; }
    .btn:hover { opacity: 0.85; }
    table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
    th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; }
    th { background: #f5f5f5; font-weight: 600; }
    td pre { margin: 0; font-size: 0.75rem; white-space: pre-wrap; max-width: 300px; }
    .view-link { color: #2563eb; text-decoration: none; }
    [data-theme="dark"] .progress-bar { background: #404040; }
    [data-theme="dark"] .progress-text { color: #9ca3af; }
    [data-theme="dark"] .badge.pending { background: #404040; color: #9ca3af; }
    [data-theme="dark"] .badge.completed { background: #064e3b; color: #6ee7b7; }
    [data-theme="dark"] .badge.failed { background: #7f1d1d; color: #fca5a5; }
    [data-theme="dark"] .badge.running { background: #1e3a5f; color: #93c5fd; }
    [data-theme="dark"] th, [data-theme="dark"] td { border-color: #404040; }
    [data-theme="dark"] th { background: #2d2d2d; }
    [data-theme="dark"] .view-link { color: #60a5fa; }
  </style>
{% endblock %}
{% block content %}
  <h1 id="batch-name" data-i18n="Batch">Batch</h1>
  <div class="progress">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="progress-text" id="progress-text">0/0</div>
  </div>
  <div class="actions">
    <a href="#" class="btn btn-success" id="download-btn" style="display:none" data-i18n="Download Results">Download Results</a>
    <button class="btn btn-secondary" id="retry-btn" style="display:none" onclick="retryFailed()" data-i18n="Retry Failed">Retry Failed</button>
    <button class="btn btn-danger" id="cancel-btn" style="display:none" onclick="cancelBatch()" data-i18n="Cancel">Cancel</button>
  </div>
  <div id="jobs-table"><p data-i18n="Loading...">Loading...</p></div>
{% endblock %}
{% block scripts %}
  <script>
    var batchId = window.location.pathname.split('/').pop();
    var pollTimer;

    function loadBatch() {
      fetch('/api/batches/' + batchId).then(function(r) { return r.json(); }).then(function(data) {
        if (data.total === 1 && data.completed === 1 && data.jobs.length === 1) {
          window.location.href = '/ui/jobs/' + data.jobs[0].id + '/result';
          return;
        }
        document.getElementById('batch-name').textContent = data.name || window.t('Batch');

        var done = data.completed + data.failed;
        var pct = data.total > 0 ? Math.round(done / data.total * 100) : 0;
        document.getElementById('progress-fill').style.width = pct + '%';
        document.getElementById('progress-text').textContent = done + '/' + data.total + ' (' + window.t('{ok} ok, {failed} failed', {ok: data.completed, failed: data.failed}) + ')';

        var allDone = done >= data.total;
        document.getElementById('download-btn').style.display = allDone && data.completed > 0 ? 'inline-block' : 'none';
        document.getElementById('retry-btn').style.display = data.failed > 0 && !data.running ? 'inline-block' : 'none';
        document.getElementById('cancel-btn').style.display = (data.pending > 0 || data.running > 0) ? 'inline-block' : 'none';

        document.getElementById('download-btn').href = '/api/batches/' + batchId + '/results';

        var html = '<table><thead><tr><th>' + window.t('File') + '</th><th>' + window.t('Status') + '</th><th>' + window.t('Model') + '</th><th>' + window.t('Error') + '</th><th></th></tr></thead><tbody>';
        data.jobs.forEach(function(j) {
          var badge = '<span class="badge ' + j.status + '">' + window.t(j.status) + '</span>';
          var err = j.error_message ? '<pre>' + j.error_message + '</pre>' : '';
          var view = j.status === 'completed'
            ? '<a class="view-link" href="/ui/jobs/' + j.id + '/result">' + window.t('View') + '</a>'
            : '';
          html += '<tr><td>' + j.filename + '</td><td>' + badge + '</td><td>' + (j.model_name || '-') + '</td><td>' + err + '</td><td>' + view + '</td></tr>';
        });
        html += '</tbody></table>';
        document.getElementById('jobs-table').innerHTML = html;

        if (!allDone) {
          clearTimeout(pollTimer);
          pollTimer = setTimeout(loadBatch, 2000);
        }
      });
    }

    function retryFailed() {
      fetch('/api/batches/' + batchId + '/retry-failed', { method: 'POST' }).then(function(r) {
        if (r.ok) loadBatch();
      });
    }

    function cancelBatch() {
      if (!confirm(window.t('Cancel pending jobs? Running jobs will finish.'))) return;
      fetch('/api/batches/' + batchId + '/cancel', { method: 'POST' }).then(function(r) {
        if (r.ok) loadBatch();
      });
    }

    loadBatch();
  </script>
{% endblock %}
