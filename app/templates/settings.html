<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="Settings — Struct My Data">Settings — Struct My Data</title>
  <script src="/i18n.js"></script>
  <style>
    body {
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      color: #1a1a1a;
    }
    h1 { font-size: 1.5rem; }
    .nav { margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .nav a { color: #2563eb; text-decoration: none; font-size: 0.9rem; }
    .nav a:hover { text-decoration: underline; }
    .theme-btn { background: none; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; padding: 0.25rem 0.5rem; font-size: 1rem; line-height: 1; }
    .connection-card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      background: #fafafa;
    }
    .connection-card h2 {
      margin: 0 0 0.75rem 0;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .connection-card h2 .badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      background: #e5e7eb;
      color: #374151;
    }
    .connection-card h2 .badge.online { background: #d1fae5; color: #065f46; }
    .connection-card h2 .badge.offline { background: #fee2e2; color: #991b1b; }
    .connection-card h2 .badge.default { background: #dbeafe; color: #1e40af; }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-bottom: 0.6rem;
    }
    .field-group label { font-size: 0.8rem; font-weight: 600; color: #374151; }
    .field-group input, .field-group select {
      padding: 0.4rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.85rem;
      font-family: "SF Mono", "Fira Code", monospace;
    }
    .field-group input:disabled { background: #f3f4f6; color: #6b7280; }
    .actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .actions button {
      padding: 0.4rem 0.8rem;
      border: none;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #6b7280; color: #fff; }
    .btn-secondary:hover { background: #4b5563; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-success { background: #059669; color: #fff; }
    .btn-success:hover { background: #047857; }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .msg { font-size: 0.8rem; margin-top: 0.4rem; padding: 0.3rem 0.5rem; border-radius: 4px; }
    .msg.ok { background: #d1fae5; color: #065f46; }
    .msg.err { background: #fee2e2; color: #991b1b; }
    .msg.hidden { display: none; }
    .inline-loader { display: inline-block; width: 12px; height: 12px; border: 2px solid #ccc; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #add-card {
      border: 2px dashed #d1d5db;
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
      cursor: pointer;
      color: #6b7280;
    }
    #add-card:hover { border-color: #2563eb; color: #2563eb; }
    #add-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      align-items: center;
      justify-content: center;
    }
    #add-modal.open { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 8px;
      padding: 1.5rem;
      max-width: 420px;
      width: 90%;
    }
    .modal-box h3 { margin: 0 0 0.75rem 0; }
    .modal-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
    [data-theme="dark"] body { background: #1a1a1a; color: #e5e5e5; }
    [data-theme="dark"] .nav a { color: #60a5fa; }
    [data-theme="dark"] .theme-btn { border-color: #555; }
    [data-theme="dark"] .connection-card { background: #2d2d2d; border-color: #404040; }
    [data-theme="dark"] .connection-card h2 .badge { background: #404040; color: #9ca3af; }
    [data-theme="dark"] .connection-card h2 .badge.online { background: #064e3b; color: #6ee7b7; }
    [data-theme="dark"] .connection-card h2 .badge.offline { background: #7f1d1d; color: #fca5a5; }
    [data-theme="dark"] .connection-card h2 .badge.default { background: #1e3a5f; color: #93c5fd; }
    [data-theme="dark"] .field-group label { color: #9ca3af; }
    [data-theme="dark"] .field-group input, [data-theme="dark"] .field-group select { background: #2d2d2d; color: #e5e5e5; border-color: #555; }
    [data-theme="dark"] .field-group input:disabled { background: #1f1f1f; color: #6b7280; }
    [data-theme="dark"] .msg.ok { background: #064e3b; color: #6ee7b7; }
    [data-theme="dark"] .msg.err { background: #7f1d1d; color: #fca5a5; }
    [data-theme="dark"] .btn-secondary { background: #4b5563; }
    [data-theme="dark"] .btn-secondary:hover { background: #6b7280; }
    [data-theme="dark"] .btn-danger:hover { background: #7f1d1d; }
    [data-theme="dark"] .btn-success:hover { background: #047857; }
    [data-theme="dark"] .btn-primary:hover { background: #3b82f6; }
    [data-theme="dark"] #add-card { border-color: #404040; color: #9ca3af; }
    [data-theme="dark"] #add-card:hover { border-color: #60a5fa; color: #60a5fa; }
    [data-theme="dark"] .modal-box { background: #2d2d2d; }
    [data-theme="dark"] #token-result code { background: #2d2d2d !important; color: #e5e5e5; }
  </style>
</head>
<body>
  <div class="nav">
      <a href="/">&larr; <span data-i18n="Extraction">Extraction</span></a>
      <a href="/usage" data-i18n="Usage">Usage</a>
    <div style="display:flex;gap:0.5rem;align-items:center">
      <div id="lang-switcher"></div>
      <button id="theme-btn" class="theme-btn" title="Toggle theme" data-i18n-title="Toggle theme">&#x1F319;</button>
      <a href="#" onclick="fetch('/auth/logout',{method:'POST'}).then(function(){window.location.href='/login'});return false" style="font-size:0.85rem;text-decoration:none" data-i18n="Logout">Logout</a>
    </div>
  </div>
  <h1 id="section-title" data-i18n="Loading...">Loading...</h1>
  <p style="font-size:0.85rem;color:#6b7280;margin-top:-0.5rem" data-i18n="Configure LLM provider connections. API keys are encrypted at rest.">
    Configure LLM provider connections. API keys are encrypted at rest.
  </p>
  <div id="connections"></div>
  <div id="add-card" onclick="openAddModal()" data-i18n="+ Add Connection">+ Add Connection</div>

  <h2 style="margin-top:2rem" data-i18n="API Tokens">API Tokens</h2>
  <p style="font-size:0.85rem;color:#6b7280;margin-top:-0.5rem" data-i18n="Generate tokens for programmatic API access.">
    Generate tokens for programmatic API access.
  </p>
  <div id="tokens-list"><p style="color:#9ca3af" data-i18n="Loading...">Loading...</p></div>
  <div style="margin-top:0.5rem">
    <button class="btn-primary" onclick="openTokenModal()" data-i18n="+ Generate Token">+ Generate Token</button>
  </div>

  <div id="token-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);align-items:center;justify-content:center" class="open">
    <div class="modal-box">
      <h3 data-i18n="Generate API Token">Generate API Token</h3>
      <div class="field-group">
        <label data-i18n="Token Name">Token Name</label>
        <input type="text" id="new-token-name" placeholder="e.g. CI pipeline" data-i18n-ph="e.g. CI pipeline">
      </div>
      <div class="field-group">
        <label data-i18n="Expires (optional)">Expires (optional)</label>
        <input type="date" id="new-token-expires">
      </div>
      <div class="modal-actions">
        <button class="btn-primary" onclick="createToken()" data-i18n="Generate">Generate</button>
        <button class="btn-secondary" onclick="closeTokenModal()" data-i18n="Cancel">Cancel</button>
      </div>
      <div id="token-result" class="msg hidden" style="margin-top:0.75rem"></div>
    </div>
  </div>

  <div id="add-modal">
    <div class="modal-box">
      <h3 data-i18n="Add Connection">Add Connection</h3>
      <div class="field-group">
        <label data-i18n="Connection Name">Connection Name</label>
        <input type="text" id="new-name" placeholder="e.g. my-openai-work" data-i18n-ph="e.g. my-openai-work">
      </div>
      <div class="field-group">
        <label data-i18n="Provider">Provider</label>
        <select id="new-provider">
          <option value="openai">OpenAI</option>
          <option value="gemini">Gemini</option>
          <option value="ollama">Ollama</option>
        </select>
      </div>
      <div id="new-fields"></div>
      <div class="modal-actions">
        <button class="btn-primary" onclick="saveNewConnection()" data-i18n="Save & Test">Save & Test</button>
        <button class="btn-secondary" onclick="closeAddModal()" data-i18n="Cancel">Cancel</button>
      </div>
      <div id="new-msg" class="msg hidden"></div>
    </div>
  </div>

  <script>
    var PROVIDER_FIELDS = {
      ollama: [
        { key: "host", label: "Host URL", default: "http://host.docker.internal:11434" },
        { key: "model", label: "Default Model", default: "" },
        { key: "vision_model", label: "Vision Model", default: "" },
      ],
      openai: [
        { key: "api_key", label: "API Key", secret: true, default: "" },
        { key: "base_url", label: "Base URL (optional)", default: "" },
      ],
      gemini: [
        { key: "api_key", label: "API Key", secret: true, default: "" },
      ],
    };

    var SECRET_KEYS = { api_key: true };
    var KEYS_ENDPOINT = '/api/keys';
    var IS_ADMIN = false;

    fetch('/auth/me').then(function(r) { return r.json(); }).then(function(u) {
      if (u.role === 'admin') {
        IS_ADMIN = true;
        KEYS_ENDPOINT = '/providers/connections';
        document.getElementById('section-title').textContent = window.t('Global Connections');
      } else {
        document.getElementById('section-title').textContent = window.t('My API Keys');
      }
      loadConnections();
    }).catch(function() {
      document.getElementById('connections').innerHTML = '<div style="color:red;padding:1rem">' + window.t('Not authenticated') + '</div>';
    });

    function loadConnections() {
      var el = document.getElementById("connections");
      el.innerHTML = '<div style="padding:1rem;text-align:center;color:#9ca3af">' + window.t('Loading...') + '</div>';
      fetch(KEYS_ENDPOINT)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          el.innerHTML = "";
          (data.keys || data.connections || []).forEach(function (c) { el.appendChild(renderCard(c)); });
        });
    }

    function renderCard(c) {
      var card = document.createElement("div");
      card.className = "connection-card";

      var isDefault = c.name === "ollama";

      var h2 = document.createElement("h2");
      h2.innerHTML = (c.name || "?") + ' <span class="badge' + (isDefault ? " default" : "") + '">' + (isDefault ? window.t("default") : c.provider) + "</span>";
      if (c.available !== undefined) {
        h2.innerHTML += ' <span class="badge ' + (c.available ? "online" : "offline") + '">' + window.t(c.available ? "online" : "offline") + "</span>";
      }
      card.appendChild(h2);

      var fields = PROVIDER_FIELDS[c.provider] || [];
      var config = c.config || {};

      fields.forEach(function (f) {
        var grp = document.createElement("div");
        grp.className = "field-group";
        var label = document.createElement("label");
        label.textContent = window.t(f.label) + " (" + f.key + ")";
        grp.appendChild(label);

        var inp = document.createElement("input");
        inp.type = f.secret ? "password" : "text";
        inp.dataset.key = f.key;
        inp.disabled = isDefault;
        var val = config[f.key] || "";
        if (f.secret && val && val.startsWith("****")) {
          inp.placeholder = val;
        } else {
          inp.value = val;
        }
        grp.appendChild(inp);
        card.appendChild(grp);
      });

      var actions = document.createElement("div");
      actions.className = "actions";

      if (!isDefault) {
        var saveBtn = document.createElement("button");
        saveBtn.className = "btn-primary";
        saveBtn.textContent = window.t("Save & Test");
        saveBtn.onclick = function () { saveConnection(c.name, c.provider, card); };
        actions.appendChild(saveBtn);

        var testBtn = document.createElement("button");
        testBtn.className = "btn-secondary";
        testBtn.textContent = window.t("Test");
        testBtn.onclick = function () { testConnection(c.name, c.provider, card); };
        actions.appendChild(testBtn);

        var delBtn = document.createElement("button");
        delBtn.className = "btn-danger";
        delBtn.textContent = window.t("Delete");
        delBtn.onclick = function () { deleteConnection(c.name, card); };
        actions.appendChild(delBtn);
      }

      card.querySelectorAll("input").forEach(function (inp) {
        if (!inp.disabled) {
          inp.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
              saveConnection(c.name, c.provider, card);
            }
          });
        }
      });

      card.appendChild(actions);

      var msg = document.createElement("div");
      msg.className = "msg hidden";
      card.appendChild(msg);

      return card;
    }

    function getCardConfig(card) {
      var config = {};
      var secrets = {};
      card.querySelectorAll("input[data-key]").forEach(function (inp) {
        var key = inp.dataset.key;
        if (SECRET_KEYS[key]) {
          var val = inp.value;
          if (inp.placeholder && !val) {
            // Keep existing secret — don't send placeholder
          } else if (val) {
            secrets[key] = val;
          }
        } else {
          config[key] = inp.value;
        }
      });
      return { config: config, secrets: secrets };
    }

    function showMsg(card, text, isError) {
      var msg = card.querySelector(".msg");
      msg.textContent = text;
      msg.className = "msg " + (isError ? "err" : "ok") + " show";
      setTimeout(function () {
        if (msg.classList.contains("show")) {
          msg.className = "msg hidden";
        }
      }, 5000);
    }

    function saveConnection(name, provider, card) {
      var data = getCardConfig(card);
      data.provider = provider;

      var saveBtn = card.querySelector(".btn-primary");
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<span class="inline-loader"></span>';

      fetch(KEYS_ENDPOINT + "/" + encodeURIComponent(name), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      }).then(function (r) {
        saveBtn.disabled = false;
        saveBtn.textContent = window.t("Save & Test");
        if (r.ok) {
          showMsg(card, window.t("Saved and tested successfully"), false);
          loadConnections();
        } else {
          r.json().then(function (e) {
            showMsg(card, window.t(e.detail) || window.t("Save failed"), true);
          });
        }
      }).catch(function () {
        saveBtn.disabled = false;
        saveBtn.textContent = window.t("Save & Test");
        showMsg(card, window.t("Network error"), true);
      });
    }

    function testConnection(name, provider, card) {
      var data = getCardConfig(card);
      data.provider = provider;

      var testBtn = card.querySelector(".btn-secondary");
      testBtn.disabled = true;
      testBtn.innerHTML = '<span class="inline-loader"></span>';

      var url = KEYS_ENDPOINT === '/providers/connections'
        ? '/providers/connections/' + encodeURIComponent(name) + '/test'
        : KEYS_ENDPOINT + "/" + encodeURIComponent(name) + "/test";
      fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      }).then(function (r) { return r.json(); }).then(function (res) {
        testBtn.disabled = false;
        testBtn.textContent = window.t("Test");
        if (res.ok) {
          showMsg(card, window.t("Connected! Models: {models}", {models: (res.models || []).join(", ")}), false);
        } else {
          showMsg(card, window.t("Connection failed: {error}", {error: res.error || window.t("unknown")}), true);
        }
      }).catch(function () {
        testBtn.disabled = false;
        testBtn.textContent = window.t("Test");
        showMsg(card, window.t("Network error"), true);
      });
    }

    function deleteConnection(name, card) {
      if (!confirm(window.t('Delete connection "{name}"?', {name: name}))) return;

      var delBtn = card.querySelector(".btn-danger");
      delBtn.disabled = true;
      delBtn.textContent = "...";

      fetch("/providers/connections/" + encodeURIComponent(name), { method: "DELETE" })
        .then(function (r) {
          if (r.ok) {
            card.remove();
          } else {
            r.json().then(function (e) { showMsg(card, window.t(e.detail) || window.t("Delete failed"), true); });
            delBtn.disabled = false;
            delBtn.textContent = window.t("Delete");
          }
        });
    }

    function openAddModal() {
      document.getElementById("add-modal").classList.add("open");
      document.getElementById("new-name").value = "";
      document.getElementById("new-provider").value = "openai";
      renderNewFields();
      document.getElementById("new-msg").className = "msg hidden";
    }

    function closeAddModal() {
      document.getElementById("add-modal").classList.remove("open");
    }

    function renderNewFields() {
      var provider = document.getElementById("new-provider").value;
      var container = document.getElementById("new-fields");
      container.innerHTML = "";
      var fields = PROVIDER_FIELDS[provider] || [];
      fields.forEach(function (f) {
        var grp = document.createElement("div");
        grp.className = "field-group";
        var label = document.createElement("label");
        label.textContent = window.t(f.label);
        grp.appendChild(label);
        var inp = document.createElement("input");
        inp.type = f.secret ? "password" : "text";
        inp.id = "new-" + f.key;
        inp.value = f.default || "";
        grp.appendChild(inp);
        container.appendChild(grp);
      });
    }

    document.getElementById("new-provider").addEventListener("change", renderNewFields);

    function saveNewConnection() {
      var name = document.getElementById("new-name").value.trim();
      var provider = document.getElementById("new-provider").value;
      if (!name) { showNewMsg(window.t("Connection name is required"), true); return; }
      if (name === "ollama") { showNewMsg(window.t("Cannot use 'ollama' as a connection name"), true); return; }

      var config = {};
      var secrets = {};
      var fields = PROVIDER_FIELDS[provider] || [];
      fields.forEach(function (f) {
        var val = document.getElementById("new-" + f.key).value;
        if (SECRET_KEYS[f.key]) {
          if (val) secrets[f.key] = val;
        } else {
          config[f.key] = val;
        }
      });

      var btn = document.querySelector("#add-modal .btn-primary");
      btn.disabled = true;
      btn.textContent = window.t("Saving...");

      fetch(KEYS_ENDPOINT + "/" + encodeURIComponent(name), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ provider: provider, config: config, secrets: secrets }),
      }).then(function (r) {
        btn.disabled = false;
        btn.textContent = window.t("Save & Test");
        if (r.ok) {
          closeAddModal();
          loadConnections();
        } else {
          r.json().then(function (e) { showNewMsg(window.t(e.detail) || window.t("Save failed"), true); });
        }
      }).catch(function () {
        btn.disabled = false;
        btn.textContent = window.t("Save & Test");
        showNewMsg(window.t("Network error"), true);
      });
    }

    function showNewMsg(text, isError) {
      var msg = document.getElementById("new-msg");
      msg.textContent = text;
      msg.className = "msg " + (isError ? "err" : "ok");
    }

    /* API Tokens */
    function loadTokens() {
      fetch("/api/tokens").then(function(r) { return r.json(); }).then(function(data) {
        var el = document.getElementById("tokens-list");
        if (!data.tokens || data.tokens.length === 0) {
          el.innerHTML = '<p style="color:#9ca3af">No tokens yet.</p>';
          return;
        }
        var html = '<table><thead><tr><th>Name</th><th>Prefix</th><th>Created</th><th>Expires</th><th>Last Used</th><th>Status</th><th></th></tr></thead><tbody>';
        data.tokens.forEach(function(t) {
          var status = t.is_active ? '<span class="badge active">active</span>' : '<span class="badge disabled">revoked</span>';
          var revokeBtn = t.is_active ? '<button class="btn-danger" style="font-size:0.8rem;padding:0.25rem 0.5rem" onclick="revokeToken(\'' + t.id + '\')">Revoke</button>' : '';
          html += '<tr><td>' + t.name + '</td><td><code>' + t.prefix + '...</code></td><td>' + (t.created_at || '').slice(0,10) + '</td><td>' + (t.expires_at || '-').slice(0,10) + '</td><td>' + (t.last_used_at || '-').slice(0,10) + '</td><td>' + status + '</td><td>' + revokeBtn + '</td></tr>';
        });
        html += '</tbody></table>';
        el.innerHTML = html;
      });
    }

    function openTokenModal() {
      document.getElementById("token-modal").style.display = "flex";
      document.getElementById("new-token-name").value = "";
      document.getElementById("new-token-expires").value = "";
      document.getElementById("token-result").className = "msg hidden";
    }

    function closeTokenModal() {
      document.getElementById("token-modal").style.display = "none";
    }

    function createToken() {
      var name = document.getElementById("new-token-name").value.trim();
      if (!name) { alert("Name is required"); return; }
      var body = { name: name };
      var expires = document.getElementById("new-token-expires").value;
      if (expires) body.expires_at = expires + "T23:59:59";

      var btn = document.querySelector("#token-modal .btn-primary");
      btn.disabled = true;
      btn.textContent = "Generating...";

      fetch("/api/tokens", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      }).then(function(r) { return r.json(); }).then(function(data) {
        btn.disabled = false;
        btn.textContent = "Generate";
        if (data.token) {
          var resultEl = document.getElementById("token-result");
          resultEl.className = "msg ok";
          resultEl.innerHTML = '<strong>Token created!</strong> Copy it now — it won\'t be shown again.<br><code style="display:block;padding:0.5rem;margin:0.5rem 0;background:#f5f5f5;border-radius:4px;font-size:0.8rem;word-break:break-all">' + data.token + '</code>';
          loadTokens();
        } else {
          document.getElementById("token-result").className = "msg err";
          document.getElementById("token-result").textContent = data.detail || "Failed to create token";
        }
      });
    }

    function revokeToken(id) {
      if (!confirm("Revoke this token? It can no longer be used.")) return;
      fetch("/api/tokens/" + id, { method: "DELETE" }).then(function(r) {
        if (r.ok) loadTokens();
        else alert("Failed to revoke token");
      });
    }

    loadConnections();
    loadTokens();
  </script>
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'light';
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      var btn = document.getElementById('theme-btn');
      if (btn) {
        btn.textContent = theme === 'dark' ? '\u2600\uFE0F' : '\uD83C\uDF19';
        btn.addEventListener('click', function() {
          var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          btn.textContent = next === 'dark' ? '\u2600\uFE0F' : '\uD83C\uDF19';
        });
      }
    })();
  </script>
</body>
</html>
