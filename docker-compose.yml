services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - pip-cache:/root/.cache/pip
    environment:
      PORT: 8080
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/structmydata
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --reload

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: structmydata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: structmydata_test
    ports:
      - "5433:5432"

volumes:
  pgdata:
  pip-cache:
