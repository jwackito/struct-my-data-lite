services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - pip-cache:/root/.cache/pip
    environment:
      PORT: 8080
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/structmydata
      OLLAMA_VISION_MODEL: gemma4:31b
      APP_SECRET_KEY: ${APP_SECRET_KEY:-9Z1rsSh191aMEthsiUU65yKApieOnFrts_QeMShq17M=}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port $$PORT --reload"
    healthcheck:
      test: curl -f http://localhost:8080/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: structmydata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 5

  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: structmydata_test
    ports:
      - "5433:5432"

volumes:
  pgdata:
  pip-cache:
